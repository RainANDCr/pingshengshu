<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>平生述 · 人生有迹，岁月成书</title>
<link rel="icon" href="favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">
<meta name="theme-color" content="#F8F6F1">
<style>
:root{
  --bg:#F8F6F1; --card:#FFFDF8; --ink:#423A32; --sub:#938B80;
  --brand:#836548; --wood:#C8A780; --sage:#B5C2B8; --lilac:#B7AEBD; --warm:#E7E4DF;
  --shadow:0 6px 24px rgba(66,58,50,.08); --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(200,167,128,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 30%, rgba(181,194,184,.05), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  min-height:100vh; line-height:1.7;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--ink)}
::selection{background:var(--wood);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D8CBB6;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--wood)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
#app{display:flex;min-height:100vh}
#main{flex:1;min-width:0;padding:32px 40px 60px;max-width:860px;margin:0 auto}
/* 桌面侧栏 */
#nav{
  width:200px;flex-shrink:0;position:sticky;top:0;height:100vh;
  padding:40px 20px;display:flex;flex-direction:column;gap:6px;
  border-right:1px solid var(--warm);background:rgba(248,246,241,.9);
}
#nav .logo{font-size:26px;letter-spacing:6px;margin-bottom:4px}
#nav .slogan{font-size:12px;color:var(--sub);letter-spacing:2px;margin-bottom:32px}
#nav button{
  text-align:left;padding:12px 16px;border-radius:12px;font-size:16px;
  color:var(--sub);letter-spacing:2px;transition:all .2s;
}
#nav button:hover{background:var(--warm);color:var(--ink)}
#nav button.active{background:var(--brand);color:#fff}
#nav .foot{margin-top:auto;font-size:11px;color:var(--sub);opacity:.7;line-height:1.8}
/* 移动端底部导航 */
#bottomnav{display:none}

@media (max-width:760px){
  #app{flex-direction:column}
  #nav{display:none}
  #main{padding:20px 18px 110px}
  #bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(255,253,248,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--warm);padding:8px 0 max(8px,env(safe-area-inset-bottom));
  }
  #bottomnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:11px;color:var(--sub);padding:4px 0;letter-spacing:1px;
  }
  #bottomnav button.active{color:var(--brand)}
  #bottomnav svg{width:22px;height:22px}
}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 0 rgba(255,255,255,.7) inset, var(--shadow);padding:24px;margin-bottom:20px;border:1px solid rgba(231,228,223,.55)}
h1.title{font-size:30px;letter-spacing:4px;font-weight:600}
.sub{color:var(--sub);font-size:14px;letter-spacing:2px}
.divider{width:36px;height:2px;background:var(--wood);margin:14px 0}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:999px;
  background:var(--brand);color:#fff;font-size:15px;letter-spacing:2px;transition:all .18s;
  box-shadow:0 4px 12px rgba(131,101,72,.22);
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 6px 16px rgba(131,101,72,.3)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--card);color:var(--brand);border:1px solid var(--wood);box-shadow:none}
.btn.ghost:hover{box-shadow:0 4px 12px rgba(131,101,72,.12)}
.btn.small{padding:8px 18px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.chip{
  display:inline-flex;align-items:center;padding:8px 18px;border-radius:12px;
  background:var(--card);border:1px solid var(--warm);font-size:14px;color:var(--sub);
  transition:all .2s;letter-spacing:1px;
}
.chip.active{background:var(--sage);color:#fff;border-color:var(--sage)}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{font-size:12px;color:var(--sub);background:var(--warm);border-radius:6px;padding:2px 10px;margin-right:6px}
.demo-badge{
  display:inline-block;font-size:11px;color:var(--brand);border:1px dashed var(--wood);
  border-radius:8px;padding:2px 10px;letter-spacing:1px;background:rgba(200,167,128,.08)
}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;letter-spacing:1px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--warm);background:var(--card);border-radius:10px;
  padding:11px 14px;font-size:15px;outline:none;transition:border .2s;
}
.field input:focus,.field textarea:focus{border-color:var(--wood)}
.field textarea{min-height:180px;resize:vertical;line-height:1.9}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- 首页 ---------- */
.hero{
  padding:40px 32px;position:relative;overflow:hidden;
  background:
    radial-gradient(400px 200px at 100% 0%, rgba(200,167,128,.10), transparent 70%),
    linear-gradient(135deg,#FFFDF8 0%,#F2ECE1 100%);
}
.hero::after{content:"平生述";position:absolute;right:10px;bottom:4px;font-size:64px;letter-spacing:10px;color:rgba(131,101,72,.05);writing-mode:vertical-rl;pointer-events:none}
.hero h2{font-size:24px;font-weight:600;letter-spacing:2px;margin-bottom:6px}
.hero p{color:var(--sub);font-size:14px}
.prompt-card{position:relative;overflow:hidden}
.prompt-card .q{font-size:20px;letter-spacing:1px;margin:12px 0 4px;font-weight:600;border-left:3px solid var(--wood);padding-left:12px}
.prompt-card .hint{color:var(--sub);font-size:13px;margin-bottom:18px}
.recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.recent-item{position:relative;overflow:hidden;background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s, box-shadow .2s}
.recent-item:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(66,58,50,.12)}
.recent-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--wood);opacity:0;transition:opacity .2s}
.recent-item:hover::before{opacity:1}
.recent-item h4{font-size:15px;margin-bottom:6px}
.recent-item p{font-size:12px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recent-item .d{font-size:11px;color:var(--sub);margin-top:8px;opacity:.8}

/* ---------- 书架 ---------- */
.shelf-page{text-align:center}
.shelf{margin-top:28px;padding:0 10px}
.shelf-row{
  position:relative;display:flex;justify-content:center;align-items:flex-end;
  gap:8px;padding:0 16px 14px;flex-wrap:nowrap;overflow-x:auto;
}
.shelf-row::after{
  content:"";display:block;height:16px;width:100%;border-radius:3px 3px 10px 10px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 14px),
    linear-gradient(180deg,#DDBF97,#B08D62);
  box-shadow:0 8px 16px rgba(66,58,50,.3);margin-top:-2px;
}
.book{
  position:relative;flex-shrink:0;border-radius:5px 8px 8px 4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;letter-spacing:8px;font-size:16px;overflow:hidden;
  transition:transform .25s ease, box-shadow .25s ease;
  box-shadow:inset -8px 0 14px rgba(0,0,0,.08), 2px 5px 12px rgba(66,58,50,.18);
  border-left:3px solid rgba(0,0,0,.07);
}
.book::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:rgba(255,255,255,.35);
}
.book::after{
  content:"";position:absolute;right:2px;top:3px;bottom:3px;width:3px;border-radius:2px;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.28) 0 2px, transparent 2px 5px);
}
.book:hover{transform:translateY(-10px) rotate(-1deg);box-shadow:inset -8px 0 14px rgba(0,0,0,.08), 6px 14px 22px rgba(66,58,50,.25)}
.book.empty{opacity:.42;filter:saturate(.35)}
.book b{font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.spine-1{background:#EDE7DC;color:#6B6157}.spine-2{background:#C7D0C5;color:#4E5A50}
.spine-3{background:#D9B2A6;color:#7A4A3C}.spine-4{background:#B7AEBD;color:#4F4658}
.spine-5{background:#E5DFD3;color:#6B6157}.spine-6{background:#BFCBD4;color:#44525E}
.spine-7{background:#E2D3C2;color:#6B5A45}.spine-8{background:#D5CBB8;color:#5C5342}
.shelf-note{margin-top:26px;color:var(--sub);font-size:13px}

/* 年龄详情 */
.age-cover{
  background:linear-gradient(160deg,#FDFBF6,#F1EAE0);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:56px 28px;text-align:center;margin-bottom:20px;
  position:relative;
}
.age-cover::before{
  content:"";position:absolute;inset:12px;border:1px solid rgba(200,167,128,.28);border-radius:calc(var(--radius) - 6px);pointer-events:none;
}
.age-cover .age-title{margin:0 auto;font-size:30px;letter-spacing:6px;font-weight:600;position:relative}
.age-cover .poem{color:var(--sub);margin:22px 0 10px;letter-spacing:3px}
.age-cover .year{font-size:14px;color:var(--brand);border:1px solid var(--wood);border-radius:999px;display:inline-block;padding:4px 22px;letter-spacing:4px;background:rgba(255,253,248,.6)}
.chapter{display:flex;gap:14px;padding:18px 10px;border-bottom:1px dashed var(--warm);cursor:pointer;align-items:flex-start;border-radius:10px;transition:background .15s}
.chapter:hover{background:rgba(231,228,223,.3)}
.chapter:last-child{border-bottom:none}
.chapter .ico{width:40px;height:40px;border-radius:50%;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.chapter h4{font-size:16px;margin-bottom:2px}
.chapter p{font-size:12px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chapter .d{margin-left:auto;font-size:12px;color:var(--sub);flex-shrink:0}

/* ---------- 回忆唤醒 ---------- */
.awaken-card{
  background:
    radial-gradient(300px 160px at 50% 0%, rgba(200,167,128,.10), transparent 70%),
    linear-gradient(150deg,#FDFBF6,#F0EBE1);
  border-radius:20px;box-shadow:var(--shadow);
  padding:48px 32px;text-align:center;margin-bottom:22px;min-height:280px;
  display:flex;flex-direction:column;justify-content:center;animation:fade .4s;
}
.awaken-card .num{font-size:13px;color:var(--sub);letter-spacing:3px;margin-bottom:16px}
.awaken-card h3{font-size:24px;letter-spacing:2px;line-height:1.6;font-weight:600}
.awaken-card .dots{margin-top:18px;color:var(--sub);font-size:12px}
.awaken-actions{display:flex;justify-content:center;gap:22px;margin-top:8px}
.awaken-actions button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.awaken-actions .cir{
  width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .2s;
}
.awaken-actions button:hover .cir{transform:scale(1.08)}
.awaken-actions .main .cir{width:80px;height:80px;background:var(--brand);color:#fff;font-size:26px}

/* ---------- 时光来信 ---------- */
.letter{
  position:relative;border-radius:14px;padding:24px 22px;margin-bottom:18px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .2s;overflow:hidden;
}
.letter:hover{transform:translateY(-3px)}
.letter.l1{background:linear-gradient(120deg,#F4EEE3,#EDE4D4)}
.letter.l2{background:linear-gradient(120deg,#E9EDE6,#DDE4DA)}
.letter.l3{background:linear-gradient(120deg,#F0E8E4,#E8DCD6)}
.letter h4{font-size:17px;margin-bottom:6px;letter-spacing:1px}
.letter p{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.letter .meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--sub)}
.letter .seal{
  position:absolute;right:18px;top:18px;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:rgba(131,101,72,.12);border:1px solid rgba(131,101,72,.3);
}
.letter.locked{filter:saturate(.7)}
.letter .status{font-size:12px;color:var(--brand)}

/* ---------- 书架入口/人生之书 ---------- */
.book-3d{
  width:150px;height:210px;border-radius:6px 12px 12px 6px;position:relative;
  background:linear-gradient(150deg,#FBF8F1,#EDE6D8);box-shadow:6px 8px 24px rgba(66,58,50,.25),inset 4px 0 8px rgba(0,0,0,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border-left:8px solid #E2D9C8;flex-shrink:0;
}
.book-3d .t{writing-mode:vertical-rl;font-size:22px;letter-spacing:10px;font-weight:600}
.book-3d .s{font-size:11px;color:var(--sub);letter-spacing:2px}
.entry{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px;cursor:pointer;transition:transform .2s;margin-bottom:14px}
.entry:hover{transform:translateY(-2px)}
.entry .em{font-size:26px}
.entry h4{font-size:15px}
.entry p{font-size:12px;color:var(--sub)}

/* ---------- 时光轴 ---------- */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--warm)}
.tl-item{position:relative;padding-bottom:26px;cursor:pointer}
.tl-item::before{
  content:"";position:absolute;left:-25px;top:8px;width:12px;height:12px;border-radius:50%;
  background:var(--wood);border:2px solid var(--card);box-shadow:0 0 0 2px var(--warm);
}
.tl-item .d{font-size:12px;color:var(--brand);letter-spacing:2px}
.tl-item h4{font-size:16px;margin:2px 0}
.tl-item p{font-size:13px;color:var(--sub)}

/* ---------- 设置 ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px dashed var(--warm);cursor:pointer}
.set-row:last-child{border-bottom:none}
.set-row h4{font-size:15px;font-weight:500}
.set-row p{font-size:12px;color:var(--sub)}
.set-row .arr{color:var(--sub)}
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;
  background:var(--ink);color:#F8F6F1;padding:11px 26px;border-radius:999px;font-size:14px;
  letter-spacing:1px;animation:fade .3s;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;margin-bottom:20px}
.stat-grid .card{margin:0;padding:18px}
.stat-grid b{font-size:26px;color:var(--brand);font-weight:600}
.stat-grid p{font-size:12px;color:var(--sub)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:14px;margin-bottom:18px;letter-spacing:1px;transition:all .15s}
.back:hover{color:var(--brand);transform:translateX(-2px)}
@media (min-width:761px){ .mobile-only{display:none!important} }
.searchbox{width:100%;border:1px solid var(--warm);background:var(--card);border-radius:12px;padding:11px 16px;font-size:15px;outline:none;margin-bottom:14px}
.searchbox:focus{border-color:var(--wood)}
.mem-img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:14px 0}
.mem-img-grid img{width:100%;border-radius:10px;box-shadow:var(--shadow);cursor:pointer}
.thumb{position:relative;display:inline-block;margin:0 8px 8px 0}
.thumb img{width:84px;height:84px;object-fit:cover;border-radius:10px;box-shadow:var(--shadow)}
.thumb .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;line-height:20px;text-align:center;cursor:pointer}
/* 人生足迹 · 地点 */
.place-card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;cursor:pointer;transition:transform .2s, box-shadow .2s;border:1px solid rgba(231,228,223,.55)}
.place-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(66,58,50,.12)}
.pc-cat{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pc-body{flex:1;min-width:0}
.pc-title{font-size:16px;font-weight:600}
.pc-sub{font-size:12px;color:var(--sub);margin-top:2px}
.pc-desc{font-size:12px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-meta{font-size:11px;color:var(--brand);margin-top:6px;letter-spacing:1px}
.place-hero{background:linear-gradient(160deg,#FDFBF6,#F1EAE0);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 24px;margin-bottom:20px;position:relative}
.place-hero::before{content:"";position:absolute;inset:12px;border:1px solid rgba(200,167,128,.25);border-radius:calc(var(--radius) - 6px);pointer-events:none}
.place-hero .pc-cat{width:56px;height:56px;font-size:26px;margin-bottom:14px}
.place-meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.place-meta-row span{font-size:12px;color:var(--sub);border:1px solid var(--warm);border-radius:999px;padding:3px 12px;background:rgba(255,253,248,.6)}
.place-pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--brand);background:rgba(200,167,128,.1);border:1px solid var(--wood);border-radius:999px;padding:4px 12px;cursor:pointer;transition:all .15s}
.place-pill:hover{background:rgba(200,167,128,.2)}
.link-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px dashed var(--warm);cursor:pointer;border-radius:8px;transition:background .15s}
.link-row:hover{background:rgba(231,228,223,.25)}
.link-row:last-child{border-bottom:none}
.link-row .pc-cat{width:36px;height:36px;font-size:17px}
.link-check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--wood);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all .15s;background:var(--card)}
.link-check.checked{background:var(--brand);border-color:var(--brand)}
.link-selector{margin:8px 0 16px;padding:10px 12px;background:rgba(247,244,238,.7);border-radius:12px;border:1px dashed var(--wood)}
.pp-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:999px;padding:3px 10px;letter-spacing:1px}
.pp-exact{color:#3f6b52;background:rgba(181,194,184,.28);border:1px solid #b5c2b8}
.pp-city{color:#6b5a3f;background:rgba(200,167,128,.18);border:1px solid #c8a780}
.pp-none{color:#8a8178;background:rgba(220,214,201,.4);border:1px solid #dcd6c9}
.pc-cover{width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow)}
.place-cover{margin:0 0 14px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(231,228,223,.6)}
.place-cover img{width:100%;max-height:260px;object-fit:cover;display:block}
.p-cover-box{position:relative;display:inline-block}
.p-cover-box img{width:140px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--warm);box-shadow:var(--shadow)}
.p-cover-x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;line-height:1}
.p-cover-empty{color:var(--sub);font-size:13px;border:1px dashed var(--wood);border-radius:10px;padding:14px;text-align:center;background:rgba(247,244,238,.5)}
/* 人生人物簿 */
.person-card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;cursor:pointer;transition:transform .2s, box-shadow .2s;border:1px solid rgba(231,228,223,.55)}
.person-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(66,58,50,.12)}
.person-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;letter-spacing:0;box-shadow:var(--shadow)}
.person-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.person-avatar.ph{background:#C8A780}
.person-hero{display:flex;gap:20px;align-items:center;background:linear-gradient(160deg,#FDFBF6,#F1EAE0);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;margin-bottom:20px;position:relative;flex-wrap:wrap}
.person-hero::before{content:"";position:absolute;inset:12px;border:1px solid rgba(200,167,128,.25);border-radius:calc(var(--radius) - 6px);pointer-events:none}
.person-meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.person-meta-row span{font-size:12px;color:var(--sub);border:1px solid var(--warm);border-radius:999px;padding:3px 12px;background:rgba(255,253,248,.6)}
.person-pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--brand);background:rgba(200,167,128,.1);border:1px solid var(--wood);border-radius:999px;padding:4px 12px;cursor:pointer;transition:all .15s}
.person-pill:hover{background:rgba(200,167,128,.2)}
/* 记忆拾遗 · 回忆碎片箱 */
.frag-quickbar{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brand);background:rgba(181,194,184,.16);border:1px dashed var(--wood);border-radius:10px;padding:8px 14px;margin-bottom:14px;cursor:pointer;transition:all .15s}
.frag-quickbar:hover{background:rgba(181,194,184,.28)}
.frag-note{background:linear-gradient(165deg,#FFFDF8,#FDFBF3);position:relative}
.frag-textarea{width:100%;min-height:120px;border:none;outline:none;background:transparent;font-size:15px;line-height:2;color:var(--text);resize:vertical;font-family:inherit}
.frag-card{background:linear-gradient(170deg,#FFFDF8,#FCF9F1);border-radius:12px;box-shadow:0 2px 10px rgba(66,58,50,.08),0 1px 2px rgba(66,58,50,.05);padding:14px 16px;margin-bottom:12px;cursor:pointer;border:1px solid rgba(231,228,223,.6);position:relative;transition:transform .2s, box-shadow .2s}
.frag-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(66,58,50,.12)}
.frag-card::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:56px;height:14px;background:rgba(200,167,128,.28);border-radius:0 0 6px 6px}
.frag-note-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.frag-status{font-size:11px;border-radius:999px;padding:2px 10px;letter-spacing:1px;background:#E8E4DB;color:var(--sub)}
.frag-status.inbox{background:rgba(181,194,184,.22);color:#5E6F62}
.frag-status.organizing{background:rgba(200,167,128,.2);color:#7A5C3C}
.frag-status.archived{background:#E5E1D8;color:#8A8175}
.frag-audio-mark{margin-left:auto;font-size:14px}
.rec-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#F4EFE6;border:1px solid rgba(200,167,128,.25);font-size:14px}
.rec-status .rec-dot{width:10px;height:10px;border-radius:50%;background:#c0392b;animation:recPulse 1s ease-in-out infinite}
.rec-status.paused .rec-dot{background:#b98a3c;animation:none}
.rec-status .rec-time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);letter-spacing:1px}
.rec-status .rec-label{color:var(--sub);font-size:13px}
.rec-hint{font-size:12px;color:var(--sub);padding:6px 0}
@keyframes recPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.frag-body{display:flex;gap:10px;align-items:flex-start}
.frag-thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow)}
.frag-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.frag-preview{font-size:14px;line-height:1.9;color:var(--text);flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.frag-card.frag-sel{border:1.5px solid var(--brand);box-shadow:0 4px 14px rgba(200,167,128,.25)}
.frag-check{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--wood);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;z-index:2}
.frag-check.checked{background:var(--brand);border-color:var(--brand)}
.map-placeholder{background:linear-gradient(160deg,#FDFBF6,#F0EBE1);border-radius:var(--radius);box-shadow:var(--shadow);padding:60px 24px;text-align:center;margin-bottom:20px}
.map-placeholder .mp-icon{font-size:48px;margin-bottom:12px}
.map-placeholder h3{font-size:18px;letter-spacing:2px;margin-bottom:8px}
.map-placeholder p{font-size:13px;color:var(--sub);line-height:2;margin-bottom:16px}
/* 人生足迹 · 真实地图 */
.map-shell{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.map-list-side{min-width:0;order:2}
.map-side{order:1;min-width:0}
.map-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.map-toolbar .searchbox{flex:1;min-width:170px;margin-bottom:0}
.places-map{height:46vh;min-height:300px;max-height:640px;border-radius:14px;box-shadow:var(--shadow);border:1px solid rgba(231,228,223,.6);z-index:1;background:#ECEAE2;position:relative}
.map-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:8px}
.map-foot a{color:var(--brand)}
.geo-results{background:var(--card);border:1px solid var(--warm);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin:2px 0 12px;max-height:260px;overflow-y:auto}
.geo-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px dashed var(--warm);cursor:pointer;font-size:13px;transition:background .15s}
.geo-item:hover{background:rgba(231,228,223,.25)}
.geo-item:last-child{border-bottom:none}
.gi-ico{flex-shrink:0}
.gi-name{flex:1;min-width:0}
.gi-name b{font-weight:600}
.gi-sub{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-pin{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 4px rgba(66,58,50,.3));cursor:pointer}
.pm-pin svg{display:block}
.pm-label{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#FFFDF8;font-weight:700;white-space:nowrap;text-shadow:0 1px 2px rgba(66,58,50,.55);pointer-events:none;letter-spacing:1px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.pm-cluster{width:38px;height:38px;border-radius:50%;background:rgba(131,101,72,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:2px solid #FFFDF8;box-shadow:0 3px 8px rgba(66,58,50,.35);cursor:pointer}
.map-banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:rgba(255,253,248,.97);color:var(--brand);border:1px solid var(--wood);border-radius:999px;padding:6px 14px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.editor-map{height:240px;border-radius:12px;border:1px solid var(--warm);box-shadow:var(--shadow);z-index:1;background:#ECEAE2;margin-top:8px;position:relative}
.leaflet-container{font-family:inherit;background:#ECEAE2}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(66,58,50,.2);border:1px solid var(--warm)}
.leaflet-popup-content{margin:12px 16px;font-size:13px;line-height:1.6}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-close-button{color:var(--sub)!important;font-size:18px!important}
.leaflet-bar{border:1px solid var(--warm)!important;box-shadow:var(--shadow)!important}
.leaflet-bar a{color:var(--brand)!important;background:var(--card)!important;border-bottom:1px solid var(--warm)!important}
.leaflet-bar a:hover{background:var(--warm)!important}
.leaflet-bar a.leaflet-disabled{color:var(--sub)!important;background:var(--card)!important}
.leaflet-control-attribution{background:rgba(255,253,248,.86)!important;color:var(--sub)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--brand)!important}
@media (min-width:900px){
  .map-shell{grid-template-columns:minmax(300px,340px) 1fr}
  .map-list-side{order:1}
  .map-side{order:2;position:sticky;top:20px}
  .places-map{height:calc(100vh - 210px);min-height:500px}
}
/* 岁岁有期 · 年度目标 */
.year-selector{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 0 18px}
.ys-btn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:20px;color:var(--brand);display:flex;align-items:center;justify-content:center;transition:all .15s}
.ys-btn:hover{background:var(--warm)}
.ys-year{font-size:22px;letter-spacing:3px;font-weight:600;min-width:96px;text-align:center}
.ov-head{font-size:15px;letter-spacing:2px;margin-bottom:12px}
.ov-nums{display:flex;gap:24px;margin-bottom:16px}
.ov-n b{font-size:26px;color:var(--brand);font-weight:600}
.ov-n p{font-size:12px;color:var(--sub)}
.ov-bar-row{display:flex;justify-content:space-between;align-items:center}
.pbar{height:8px;border-radius:6px;background:var(--warm);overflow:hidden;margin-top:6px}
.pbar-fill{height:100%;border-radius:6px;background:var(--wood);transition:width .4s ease}
.pbar-sage{background:var(--sage)}
.pbar-done{background:var(--brand)}
.goal-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;cursor:pointer;transition:transform .2s, box-shadow .2s}
.goal-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(66,58,50,.12)}
.gc-top{display:flex;align-items:center;gap:10px}
.gc-cat{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.gc-title{font-size:16px;font-weight:600;flex:1;min-width:0}
.gc-stamp{font-size:12px;color:#7a4a3c;border:1.5px solid #d9b2a6;border-radius:8px;padding:2px 8px;transform:rotate(-6deg);letter-spacing:2px;flex-shrink:0;background:rgba(217,178,166,.12)}
.gc-sub{font-size:12px;color:var(--sub);margin-top:8px}
.gc-desc{font-size:13px;color:var(--sub);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-bar-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.gc-status{font-size:12px;color:var(--sub);border-radius:6px;padding:2px 10px}
.gc-status.st0{background:var(--warm);color:var(--sub)}
.gc-status.st1{background:#f0e8e4;color:#8a5a3c}
.gc-status.st2{background:#e9ede6;color:#5c6b52}
.gc-status.st3{background:#f0eee0;color:#8a7a4c}
.gc-status.st4{background:#eee9e9;color:#8a6a6a}
.gc-progress{font-size:12px;color:var(--brand)}
.goal-head{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;border:1px solid rgba(231,228,223,.55)}
.task-input{flex:1;border:1px solid var(--warm);background:var(--card);border-radius:10px;padding:10px 14px;font-size:15px;outline:none}
.task-input:focus{border-color:var(--wood)}
.task-row{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px dashed var(--warm);transition:background .15s;border-radius:8px}
.task-row:hover{background:rgba(231,228,223,.25)}
.task-row:last-child{border-bottom:none}
.task-row.editing{flex-wrap:wrap;background:rgba(231,228,223,.15)}
.task-check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--wood);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;cursor:pointer;transition:all .15s;background:var(--card)}
.task-check.checked{background:var(--brand);border-color:var(--brand)}
.task-body{flex:1;min-width:0;cursor:pointer}
.task-title{font-size:15px}
.task-row.done .task-title{text-decoration:line-through;color:var(--sub)}
.task-due{font-size:11px;color:var(--sub);margin-top:2px}
.task-actions{display:flex;gap:2px;flex-shrink:0}
.task-actions button{width:26px;height:26px;border-radius:6px;color:var(--sub);font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.task-actions button:hover{background:var(--warm);color:var(--brand)}
.done-toggle{font-size:13px;color:var(--sub);margin-top:12px;padding:8px 0;cursor:pointer;letter-spacing:1px;user-select:none}
.done-toggle:hover{color:var(--brand)}
.auto-summary{background:linear-gradient(150deg,#FDFBF6,#F0EBE1);border-radius:12px;padding:16px;font-size:14px;line-height:2;color:var(--ink);margin-top:8px}
.rev-line{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--warm);cursor:pointer;border-radius:8px}
.rev-line:last-child{border-bottom:none}
.rev-line:hover{background:rgba(231,228,223,.25)}
.rev-ico{width:28px;height:28px;border-radius:8px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.rev-title{flex:1;min-width:0;font-size:14px}
.rev-sub{font-size:12px;color:var(--sub);flex-shrink:0}
#print-host{display:none}
.print-book{font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;color:#423A32;line-height:2;max-width:720px;margin:0 auto}
.pb-cover{height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;page-break-after:always}
.pb-t{writing-mode:vertical-rl;font-size:42px;letter-spacing:14px;font-weight:600}
.pb-s{margin-top:22px;color:#938B80;letter-spacing:4px}
.pb-page{page-break-after:always}
.pb-page h2{font-size:22px;letter-spacing:4px;margin:20px 0;text-align:center}
.pb-mem{page-break-inside:avoid;margin:22px 0}
.pb-mem h3{margin-top:16px}
.pb-meta{color:#938B80;font-size:12px;margin:4px 0 10px}
.pb-mem p{white-space:pre-wrap}
.pb-mem img{max-width:100%;margin:8px 0;border-radius:4px}
.pb-toc div{padding:6px 0;border-bottom:1px dashed #E7E4DF}
.cover-swatch{width:40px;height:54px;border-radius:4px 6px 6px 4px;cursor:pointer;border:2px solid transparent;box-shadow:var(--shadow);transition:all .2s}
.cover-swatch.on{border-color:var(--brand);transform:translateY(-2px)}
.cover-swatch.s1{background:linear-gradient(120deg,#F4EEE3,#EDE4D4)}
.cover-swatch.s2{background:linear-gradient(120deg,#E9EDE6,#DDE4DA)}
.cover-swatch.s3{background:linear-gradient(120deg,#F0E8E4,#E8DCD6)}
#seal-host{position:fixed;inset:0;z-index:200;background:rgba(248,246,241,.96);display:flex;align-items:center;justify-content:center;animation:fade .2s}
.seal-box{position:relative;width:220px;height:150px}
.seal-box .env{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;height:120px;background:linear-gradient(120deg,#EDE4D4,#E0D3BC);border-radius:6px}
.seal-box .flap{position:absolute;left:0;top:0;width:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;border-top:70px solid #D8C5A8;transform-origin:top;animation:flapclose 1.6s ease forwards}
.seal-box .paper{position:absolute;left:50%;top:50%;width:140px;height:96px;background:#FFFDF8;border:1px solid var(--warm);transform:translate(-50%,-50%);animation:paperfold 1.6s ease forwards}
.seal-box .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:0;animation:sealdot 1.6s ease forwards}
.seal-tip{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);color:var(--sub);letter-spacing:3px;font-size:13px;white-space:nowrap}
@keyframes paperfold{0%{transform:translate(-50%,-50%) scaleY(1);opacity:1}80%{transform:translate(-50%,-50%) scaleY(.35);opacity:.6}100%{transform:translate(-50%,-50%) scaleY(.3);opacity:0}}
@keyframes flapclose{0%{transform:rotateX(0)}55%{transform:rotateX(0)}100%{transform:rotateX(180deg)}}
@keyframes sealdot{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}60%{opacity:0}80%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media print{
  #app,#bottomnav,.toast{display:none!important}
  #print-host{display:block!important;position:absolute;left:0;top:0;width:100%}
  body{background:#fff}
}
/* ---------- 人生专题集 ---------- */
.tbook-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;text-align:left}
.tbook-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .2s, box-shadow .2s;border:1px solid rgba(231,228,223,.6);display:flex;flex-direction:column}
.tbook-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(66,58,50,.14)}
.tbook-cover{position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 14px;text-align:center;overflow:hidden}
.tbook-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(255,255,255,.35)}
.tbook-cover::after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.35);border-radius:4px;pointer-events:none}
.tbook-cover-t{writing-mode:vertical-rl;font-size:20px;letter-spacing:6px;font-weight:600;max-height:70%;overflow:hidden}
.tbook-cover-s{font-size:10px;letter-spacing:2px;margin-top:12px;opacity:.8;max-width:80%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbook-card-body{padding:12px 14px;flex:1}
.tbook-hero{position:relative;border-radius:var(--radius);box-shadow:var(--shadow);padding:48px 28px;text-align:center;margin-bottom:20px}
.tbook-hero::before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.5);border-radius:calc(var(--radius) - 6px);pointer-events:none}
.tbook-hero-t{font-size:28px;letter-spacing:4px;font-weight:600}
.tbook-hero-s{font-size:14px;letter-spacing:2px;margin-top:8px;opacity:.85}
.tbook-hero-meta{font-size:12px;letter-spacing:2px;margin-top:16px;opacity:.85}
.tchapter{border:1px solid rgba(231,228,223,.7);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:rgba(255,253,248,.6)}
.tchapter-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tchapter-title{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;font-size:15px;font-weight:600;letter-spacing:1px;outline:none;transition:border .15s, background .15s}
.tchapter-title:hover{background:var(--warm)}
.tchapter-title:focus{border-color:var(--wood);background:var(--card)}
.tentry-list{padding-left:6px}
.tentry{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dashed var(--warm)}
.tentry:last-of-type{border-bottom:none}
.tentry-body{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.tentry-ico{width:30px;height:30px;border-radius:8px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tb-swatch{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;box-shadow:0 1px 3px rgba(66,58,50,.2);transition:transform .12s}
.tb-swatch:hover{transform:scale(1.1)}
.tb-swatch.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(131,101,72,.25)}
.toc-chapter{margin-bottom:14px}
.toc-chapter-title{font-size:15px;font-weight:600;letter-spacing:1px;padding:8px 10px;border-left:3px solid var(--wood);margin-bottom:4px}
.tbook-tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:8px}
.tbook-tpl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:1.5px solid var(--warm);border-radius:12px;cursor:pointer;background:var(--card);transition:all .15s}
.tbook-tpl:hover{border-color:var(--wood)}
.tbook-tpl.on{border-color:var(--brand);background:rgba(131,101,72,.08)}
.tbook-tpl-ico{font-size:22px}

/* ---------- 工具 ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
function calcAge(dateStr){
  if(!dateStr || !db.profile.birthDate) return null;
  const b=new Date(db.profile.birthDate), e=new Date(dateStr);
  if(isNaN(b)||isNaN(e)) return null;
  let a=e.getFullYear()-b.getFullYear();
  const m=e.getMonth()-b.getMonth();
  if(m<0||(m===0&&e.getDate()<b.getDate())) a--;
  return a>=0?a:null;
}
function ageRangeOf(memories){
  const s=new Set(); memories.forEach(m=>s.add(m.age));
  return [...s].filter(a=>a!=null).sort((x,y)=>x-y);
}

/* ---------- BYOK AI 服务层（客户端直连，HTTPS） ---------- */
const AI_PROVIDERS = {
  deepseek: { name:"DeepSeek", baseUrl:"https://api.deepseek.com/v1", defaultModel:"deepseek-chat" },
  openai:   { name:"OpenAI",  baseUrl:"https://api.openai.com/v1",   defaultModel:"gpt-4o-mini" },
  compatible:{ name:"OpenAI 兼容服务", baseUrl:"", defaultModel:"" },
};
function baseUrlOf(cfg){ cfg=cfg||db.ai; const p=cfg.provider||"deepseek"; if(p==="compatible") return (cfg.baseUrl||"").trim().replace(/\/+$/,""); return AI_PROVIDERS[p].baseUrl; }
function modelOf(cfg){ cfg=cfg||db.ai; return (cfg.model||"").trim() || AI_PROVIDERS[cfg.provider||"deepseek"].defaultModel; }
function aiKey(){ return (db.ai.key||"").trim(); }
async function aiErrorMessage(res){
  if(res.status===401) return "API Key 无效或未授权（401）";
  if(res.status===402) return "账户余额不足（402）";
  if(res.status===404) return "模型不存在或接口地址错误（404）";
  if(res.status===429) return "请求频率超限，请稍后重试（429）";
  if(res.status>=500) return "服务商暂时不可用（"+res.status+"）";
  try{ const j=await res.json(); if(j && j.error && j.error.message) return j.error.message; }catch(e){}
  return "服务端返回异常（"+res.status+"）";
}
async function aiRequest(messages, timeout){
  const key=aiKey(), base=baseUrlOf(), model=modelOf();
  if(!key) throw {kind:"nokey", message:"请先在「我的 → AI 模型设置」配置 API Key"};
  if(!base) throw {kind:"config", message:"请填写服务接口地址（Base URL）"};
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(), timeout||30000);
  try{
    const res=await fetch(base+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model, messages, stream:false, temperature:0.7}),
      signal:ctrl.signal,
    });
    if(!res.ok) throw {kind:"http", message: await aiErrorMessage(res)};
    const j=await res.json();
    const text=j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if(!text) throw {kind:"format", message:"响应格式异常，未获取到内容"};
    return text.trim();
  }catch(err){
    if(err && err.kind) throw err;
    if(err.name==="AbortError") throw {kind:"timeout", message:"请求超时，请稍后重试"};
    throw {kind:"network", message:"网络连接失败："+(err.message||err)};
  }finally{ clearTimeout(t); }
}
async function aiTestConnection(cfg){
  cfg=cfg||db.ai;
  const key=(cfg.key||"").trim(), base=baseUrlOf(cfg);
  if(!key) throw {kind:"nokey", message:"请先填写 API Key"};
  if(!base) throw {kind:"config", message:"请填写服务接口地址（Base URL）"};
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(base+"/models", {headers:{"Authorization":"Bearer "+key}, signal:ctrl.signal});
    if(!res.ok) throw {kind:"http", message: await aiErrorMessage(res)};
    return true;
  }catch(err){
    if(err && err.kind) throw err;
    if(err.name==="AbortError") throw {kind:"timeout", message:"连接超时"};
    throw {kind:"network", message:"网络连接失败："+(err.message||err)};
  }finally{ clearTimeout(t); }
}

const POLISH_STYLES = {
  "原味整理":"只修正标点、错别字和语句顺序，不改动事实、时间、人物、地点与结局，保持原意。",
  "温柔叙事":"以自然、细腻、有温度的方式重新描述，保留真实经历与个人情绪。",
  "文学散文":"增强语言的文学性与画面感，但绝不虚构任何细节。",
  "朴实口述":"尽量保留讲述者原有的语言习惯，口语化、真诚自然。",
};
function polishSystemPrompt(){
  return `你是「平生述」个人回忆录的专业润色编辑，负责把用户零散的口述或原始记录，改写成更通顺、更生动、更有感染力的文字。

【事实约束（必须遵守）】
1. 不编造不存在的经历，不添加未经确认的人物，不擅自修改时间、地点、人物关系与事件结局。
2. 不把不确定的回忆改写成确定事实，不虚构细节，不用夸张的文学表达替代真实记忆。

【改写要求（必须做到）】
3. 必须做出实质性改写，严禁原样照抄原文。在事实不变的前提下，优化用词、调整语序、补充衔接、删繁就简，让表达更流畅自然，并契合用户指定的风格。
4. 保留用户原有的情绪、口吻与回忆特色，对信息缺失保持克制，不要凭空补足。

【输出要求】
5. 只输出改写后的正文本身，不要解释、不要加标题、不要加引号、不要输出任何前后缀。`;
}

async function genPolish(id){
  const m=db.memories.find(x=>x.id===id); if(!m) return;
  const src=m.originalContent||m.content;
  if(!src || !src.trim()) return toast("正文为空，无法润写");
  if(!aiKey()){ toast("请先配置 API Key"); setTimeout(()=>go("ai"),800); return; }
  if(_polishStyle==="自定义"){ _polishCustom=($("#polish-custom")||{value:""}).value||""; if(!_polishCustom.trim()) return toast("请填写自定义润写要求"); }
  if(!confirm("即将把这段原文发送至模型服务商进行润写，可能产生费用。是否继续？")) return;
  const styleDesc=_polishStyle==="自定义"?_polishCustom:POLISH_STYLES[_polishStyle];
  const btn=$("#polish-gen"); if(btn){btn.disabled=true; btn.textContent="生成中…";}
  try{
    const out=await aiRequest([
      {role:"system", content:polishSystemPrompt()},
      {role:"user", content:`请按照下面的风格，对这段回忆进行润色改写。注意：一定要做出实际改写，不要原样返回原文。\n\n润写风格：${_polishStyle}（${styleDesc}）\n\n原文：\n${src}`},
    ]);
    _polishResult=out;
    const box=$("#polish-result"); if(box) box.value=out;
    toast("润写完成");
  }catch(err){ toast("润写失败："+err.message); }
  finally{ if(btn){btn.disabled=false; btn.textContent="✨ 生成润写";} render(); }
}
function acceptPolish(id){
  const m=db.memories.find(x=>x.id===id); if(!m) return;
  const result=($("#polish-result")||{value:_polishResult}).value.trim() || _polishResult;
  if(!result) return toast("暂无润写结果");
  if(!m.originalContent) m.originalContent=m.content;
  m.polishHistory=m.polishHistory||[];
  m.polishHistory.push({style:_polishStyle, model:modelOf(), sourceText:m.originalContent, resultText:result, createdAt:Date.now(), acceptedAt:Date.now()});
  m.content=result;
  save(); toast("已接受润写，原文已保留可恢复"); go("memory", id);
}
function copyPolish(){
  const v=($("#polish-result")||{value:""}).value;
  if(!v) return;
  navigator.clipboard.writeText(v).then(()=>toast("已复制")).catch(()=>toast("复制失败"));
}
function restoreOriginal(id){
  const m=db.memories.find(x=>x.id===id); if(!m || !m.originalContent) return;
  if(!confirm("恢复为润写前的原文？（润写结果将被替换，历史版本仍保留）")) return;
  m.content=m.originalContent; save(); toast("已恢复原文"); go("memory", id);
}

/* 统一图片采集：MIME 白名单 + 大小限制 + 压缩失败重试提示（记录页与碎片页共用） */
function handleImageFile(file, target){
  if(!file) return;
  const t=(file.type||"").toLowerCase();
  if(t==="image/heic"||t==="image/heif") return toast("暂不支持 HEIC 格式，请在相册里另存为 JPG 后重试");
  if(IMG_TYPES.indexOf(t)<0) return toast("不支持的图片格式："+(t||"未知")+"（支持 JPG/PNG/GIF/WebP/BMP）");
  if(file.size>IMG_MAX_BYTES) return toast("单张图片请小于 15MB");
  resizeImage(file, src=>pushImage(target, src), ()=>toast("这张图片无法读取，可能已损坏，请重试"));
}

  e.preventDefault();
  [...e.dataTransfer.files].forEach(f=>handleImageFile(f, dz.dataset.dropzone));
});
function resizeImage(file, cb, errCb){
  const r=new FileReader();
  r.onerror=()=>{ errCb && errCb(); };
  r.onload=e=>{
    const img=new Image();
    img.onerror=()=>{ errCb && errCb(); };
    img.onload=()=>{
      try{
        const max=900;
        const s=Math.min(1, max/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.62));
      }catch(err){ errCb && errCb(); }
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

    const stateText=_recState==="recording"?"录音中":"已暂停";

    return `<div class="rec-status ${_recState}"><span class="rec-dot"></span><span class="rec-time">${mm}:${ss}</span><span class="rec-label">${stateText}</span></div>
      <div class="row" style="margin-top:8px">

          ?`<button type="button" class="btn small ghost" onclick="pauseRec()">⏸ 暂停</button>`
          :`<button type="button" class="btn small ghost" onclick="resumeRec()">▶️ 继续</button>`):""}
        <button type="button" class="btn small ghost" onclick="stopRec()">⏹ 停止并保存</button>
        <button type="button" class="btn small ghost" style="color:#b3554a" onclick="cancelRec()">✕ 取消</button>
      </div>`;
  }
  const au=currentAudio();
  if(au) return `<audio controls src="${au}" style="width:100%"></audio>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn small ghost" onclick="startRec()">🎙 重新录制</button>
      <button type="button" class="btn small ghost" style="color:#b3554a" onclick="removeCurrentAudio()">🗑 删除录音</button>
    </div>`;
  const sup=audioSupport();
  return `<div class="rec-hint">${sup.ok?"最长可录 10 分钟，可暂停 / 继续 · 中途来电或切后台会自动保存已录内容":sup.reason}</div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn small ghost" ${sup.ok?"":"disabled"} onclick="startRec()">🎙 开始录音</button>
    </div>`;
}
function renderRecUi(){
  const box=$("#rec-ui"); if(!box) return;
  box.innerHTML=recUiHtml();
}
function _recTick(){
  _recDurMs=Date.now()-_recStartTs;
  const t=document.querySelector("#rec-ui .rec-time");
  if(t){ const mm=String(Math.floor(_recDurMs/60000)).padStart(2,"0"); const ss=String(Math.floor((_recDurMs%60000)/1000)).padStart(2,"0"); t.textContent=mm+":"+ss; }
}
function _resetRec(){
  if(_recState!=="idle" && REC){ try{ REC.ondataavailable=null; REC.onstop=null; REC.stop(); }catch(e){} }
  _cleanupRecStream();
  _recState="idle"; _recDurMs=0; REC_CHUNKS=[];
  if(_recTimer) clearInterval(_recTimer); if(_recMaxTimer) clearTimeout(_recMaxTimer);
}
async function startRec(){
  const sup=audioSupport(); if(!sup.ok) return toast(sup.reason);
  if(_recState==="recording") return toast("正在录音中");
  if(_recState==="paused" && REC){ try{ REC.resume(); _recState="recording"; _recStartTs=Date.now()-_recDurMs; _recTimer=setInterval(_recTick,200); renderRecUi(); return; }catch(e){} }
  try{
    REC_CHUNKS=[]; _recDurMs=0;
    REC_STREAM=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=pickAudioMime();
    REC=mime?new MediaRecorder(REC_STREAM,{mimeType:mime}):new MediaRecorder(REC_STREAM);
    REC.ondataavailable=e=>{ if(e.data && e.data.size) REC_CHUNKS.push(e.data); };
    REC.onstop=_finalizeRec;
    // 来电 / 切后台 / 拔耳机导致轨道中断：自动收尾，已录内容不丢
    REC_STREAM.getTracks().forEach(t=>{ t.onended=()=>{ if(_recState!=="idle"){ toast("录音被中断（可能来电或切后台），已自动保存"); stopRec(); } }; });
    REC.start(1000);
    _recState="recording"; _recStartTs=Date.now();
    _recTimer=setInterval(_recTick,200);
    _recMaxTimer=setTimeout(()=>{ if(_recState==="recording"){ toast("已达最长 10 分钟，自动停止"); stopRec(); } }, REC_MAX_MS);
    renderRecUi();
    toast("开始录音…");
  }catch(err){
    const name=err && err.name;
    let msg="无法获取麦克风权限："+((err&&err.message)||"未知错误");
    if(name==="NotAllowedError"||name==="SecurityError") msg="麦克风权限被拒绝：请在浏览器 / 系统设置中允许使用麦克风后重试";
    else if(name==="NotFoundError"||name==="DevicesNotFoundError") msg="未检测到麦克风设备";
    else if(name==="NotReadableError"||name==="TrackStartError") msg="麦克风被其他应用占用或不可用";
    toast(msg);
  }
}
function pauseRec(){ if(REC && _recState==="recording"){ try{ REC.pause(); _recState="paused"; if(_recTimer) clearInterval(_recTimer); renderRecUi(); }catch(e){ toast("当前环境不支持暂停"); } } }
function resumeRec(){ if(REC && _recState==="paused"){ try{ REC.resume(); _recState="recording"; _recStartTs=Date.now()-_recDurMs; _recTimer=setInterval(_recTick,200); renderRecUi(); }catch(e){} } }
function stopRec(){ if(REC && _recState!=="idle"){ REC.stop(); } }
function cancelRec(){
  if(REC && _recState!=="idle"){ try{ REC.ondataavailable=null; REC.onstop=null; REC.stop(); }catch(e){} }
  _cleanupRecStream();
  _recState="idle"; _recDurMs=0; REC_CHUNKS=[];
  if(_recTimer) clearInterval(_recTimer); if(_recMaxTimer) clearTimeout(_recMaxTimer);
  renderRecUi();
  toast("已取消录音");
}
function _finalizeRec(){
  const dur=_recDurMs;
  _cleanupRecStream();
  _recState="idle";
  if(_recTimer) clearInterval(_recTimer); if(_recMaxTimer) clearTimeout(_recMaxTimer);
  const type=(REC && REC.mimeType) || pickAudioMime() || "audio/webm";
  const blob=new Blob(REC_CHUNKS,{type:type});
  if(!blob.size){ REC_CHUNKS=[]; renderRecUi(); toast("没有录到声音"); return; }
  const r=new FileReader();
  r.onload=()=>{ setCurrentAudio(r.result); REC_CHUNKS=[]; renderRecUi(); toast("录音已保存（"+fmtDur(dur)+"）"); };
  r.onerror=()=>{ REC_CHUNKS=[]; renderRecUi(); toast("录音读取失败，请重试"); };
  r.readAsDataURL(blob);
}
function _cleanupRecStream(){ if(REC_STREAM){ REC_STREAM.getTracks().forEach(t=>{ try{t.stop();}catch(e){} }); REC_STREAM=null; } }
function fmtDur(ms){ const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000); return (m?m+"分":"")+(s?s+"秒":(m?"":"0秒")); }
function removeCurrentAudio(){ setCurrentAudio(null); renderRecUi(); }

function saveMemory(){
  const title=$("#f-title").value.trim(), body=$("#f-body").value.trim();
  if(!title && !body && !EDIT_IMAGES.length) return toast("先写下一点内容吧");
  const data={
    title:title||"无题", content:body,
    eventDate:$("#f-date").value||"",
    age:$("#f-age").value?parseInt($("#f-age").value):calcAge($("#f-date").value),
    place:$("#f-place").value.trim(), tags:$("#f-tags").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    images:EDIT_IMAGES, audio:EDIT_AUDIO||null, prompt:sessionStorage.getItem("pps_prompt")||"",
  };
  if(EDIT){
    Object.assign(EDIT, data); syncMemPersonLinks(EDIT.id); save();
    toast("已保存修改"); go("memory", EDIT.id);
  }else{
    // 幂等：同一批碎片转回忆，重复保存不产生重复文章
    if(_pendingConv && _pendingConv.batchId){
      const existing=(db.fragmentMemoryLinks||[]).find(l=>l.conversionBatchId===_pendingConv.batchId);
      if(existing){
        toast("这篇回忆已经保存过了，直接为你打开");
        _pendingConv=null; _pendingPlaceIds=[];
        go("memory", existing.memoryId);
        return;
      }
    }
    const m={id:uid(), ...data, createdAt:Date.now()};
    db.memories.push(m);
    syncMemPersonLinks(m.id);
    // 来源关联：碎片 → 回忆
    if(_pendingConv && Array.isArray(_pendingConv.sourceFragIds) && _pendingConv.sourceFragIds.length){
      db.fragmentMemoryLinks=(db.fragmentMemoryLinks||[]);
      _pendingConv.sourceFragIds.forEach(fid=>{
        if((db.fragments||[]).some(f=>f.id===fid) && !db.fragmentMemoryLinks.some(l=>l.fragmentId===fid && l.memoryId===m.id)){
          db.fragmentMemoryLinks.push({id:uid(), fragmentId:fid, memoryId:m.id, conversionBatchId:_pendingConv.batchId, createdAt:Date.now()});
        }
      });
    }
    // 地点关联：碎片带出的足迹 → 回忆
    (_pendingPlaceIds||[]).forEach(pid=>{
      if((db.places||[]).some(p=>p.id===pid) && !(db.memoryPlaceLinks||[]).some(l=>l.memoryId===m.id && l.placeId===pid)){
        db.memoryPlaceLinks=(db.memoryPlaceLinks||[]);
        db.memoryPlaceLinks.push({id:uid(), memoryId:m.id, placeId:pid, sortOrder:(db.memoryPlaceLinks||[]).length+1, createdAt:Date.now()});
      }
    });
    _pendingConv=null; _pendingPlaceIds=[];
    const goalLink=sessionStorage.getItem("pps_goalLink");
    if(goalLink){
      db.goalMemoryLinks=(db.goalMemoryLinks||[]);
      db.goalMemoryLinks.push({id:uid(), goalId:goalLink, memoryId:m.id, relationType:"完成回忆", createdAt:Date.now()});
      sessionStorage.removeItem("pps_goalLink");
    }
    save();
    localStorage.removeItem("pps_draft");
    toast("已保存，归档至「"+(m.age!=null?m.age+"岁":"待整理")+"」");
    setTimeout(()=>go(m.age!=null?"shelf":"time"),600);
  }
}

function entriesOfBook(bookId){ return (db.thematicEntries||[]).filter(e=>e.bookId===bookId); }

function tbookCoverBg(b){

/* ---- 阅读进度（独立于年龄书架） ---- */
function progressOfBook(bookId){ return (db.thematicProgress||[]).find(p=>p.bookId===bookId) || null; }
function markThematicProgress(bookId, chapterId, memoryId){
  db.thematicProgress = db.thematicProgress||[];
  const ex=db.thematicProgress.find(p=>p.bookId===bookId);
  if(ex){ ex.chapterId=chapterId; ex.memoryId=memoryId; ex.updatedAt=Date.now(); }
  else db.thematicProgress.push({id:uid(), bookId, chapterId, memoryId, updatedAt:Date.now()});
  save();
}
/* 构建专题书扁平阅读序列（全书只算一次）：flat=[{memoryId,chapterId}]，idxOf=memoryId→首个序号 */
function thematicFlat(bookId){
  const flat=[], idxOf=new Map();
  chaptersOfBook(bookId).forEach(c=>{
    entriesOfChapter(c.id).forEach(e=>{
      if(!idxOf.has(e.memoryId)) idxOf.set(e.memoryId, flat.length);
      flat.push({memoryId:e.memoryId, chapterId:c.id});
    });
  });
  return {flat, idxOf};
}
/* 返回该书的阅读进度快照：{total, readIdx}，readIdx 为当前读到第几篇（1 起）；可传入 thematicFlat 结果避免重复计算 */
function thematicReadState(bookId, tf){
  const {flat, idxOf} = tf || thematicFlat(bookId);
  const prog=progressOfBook(bookId);
  let readIdx=0;
  if(prog){ const i=idxOf.get(prog.memoryId); if(i!==undefined) readIdx=i+1; }
  return {total:flat.length, readIdx, memoryId:prog?prog.memoryId:null};
}

  if(i<0||j<0||j>=es.length) return;

function ruleMatchMemory(r, m){
  if(!r.enabled) return true;
  if(r.tags && r.tags.length && !(m.tags||[]).some(t=>r.tags.includes(t))) return false;
  const y=m.eventDate?m.eventDate.slice(0,4):"";
  if(r.yearFrom && (!y || y<r.yearFrom)) return false;
  if(r.yearTo && (!y || y>r.yearTo)) return false;
  if(r.personId && !personIdsOfMemory(m.id).includes(r.personId)) return false;
  if(r.placeId && !placeIdsOfMemory(m.id).includes(r.placeId)) return false;
  if(r.ageFrom && (m.age==null || m.age<Number(r.ageFrom))) return false;
  if(r.ageTo && (m.age==null || m.age>Number(r.ageTo))) return false;
  if(r.keyword){ const q=(r.keyword||"").trim().toLowerCase(); if(q && !((m.title+" "+(m.content||"")).toLowerCase()).includes(q)) return false; }
  return true;
}

function timeRows(events, q){
  const ql = (q||"").trim().toLowerCase();
  return [...events].sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).filter(e=>{
    if(_tagFilter!=="__all__" && !(e.tags||[]).includes(_tagFilter)) return false;
    if(ql){
      const hay = (e.title+" "+(e.content||"")+" "+(e.tags||[]).join(" ")).toLowerCase();
      if(!hay.includes(ql)) return false;
    }
    return true;
  }).map(e=>{
    if(e.type==="goal"){
      return `<div class="tl-item" onclick="go('goal','${e.id}')">
        <div class="d">${esc(e.date)} · 🎯 目标达成</div>
        <h4>${esc(e.title)}</h4><p>${esc(e.content||"")}</p>
        <div style="margin-top:6px">${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>`;
    }
    const m=db.memories.find(x=>x.id===e.id);
    const pls=placesOfMemory(e.id);
    return `<div class="tl-item" onclick="go('memory','${e.id}')">
      <div class="d">${esc(e.date||"时间待整理")} ${m && m.age!=null?"· "+m.age+"岁":""}</div>
      <h4>${esc(e.title)}</h4><p>${esc(e.content||"")}</p>
      <div style="margin-top:6px">${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${pls.length?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${pls.map(p=>`<span class="place-pill" onclick="event.stopPropagation();go('place','${p.id}')">${(placeCatOf(p.categoryId)?placeCatOf(p.categoryId).icon:"📍")} ${esc(p.name)}</span>`).join("")}</div>`:""}
      ${m && (m.images||[]).length?`<div style="margin-top:8px">🖼️ ${m.images.length} 张图片</div>`:""}
    </div>`;
  }).join("") || `<p class="sub" style="padding:10px">没有符合条件的记录。</p>`;
}
function filterTime(){
  const q=$("#time-search").value;
  $("#time-list").innerHTML = timeRows(timelineEvents(), q);
}
document.addEventListener("click", e=>{
  const tg = e.target.closest("[data-tag]");

let _placeYearFilter = "__all__";
let _placeAgeFilter = "__all__";
let _placeView = "list";
let _linkSelectorOpen = false, _curPlaceId = null, _goalLinkSelectorOpen = false;
function placeCatOf(id){ return (db.placeCategories||[]).find(c=>c.id===id); }
function placeLinksOfPlace(placeId){ return (db.memoryPlaceLinks||[]).filter(l=>l.placeId===placeId); }
function placeLinksOfMemory(memoryId){ return (db.memoryPlaceLinks||[]).filter(l=>l.memoryId===memoryId); }
/* 足迹关联索引缓存：一次构建 placeId→Memory[] 与 memoryId→LifePlace[]，供列表/地图/筛选复用，消除 O(地点×关联×回忆) 重复查找 */
let _placeTimeCache = null;
let _placeMemIdx = null;
function invalidatePlaceMemIndex(){ _placeMemIdx = null; _placeTimeCache = null; }
function placeMemIndex(){
  if(_placeMemIdx) return _placeMemIdx;
  const byPlace=new Map(), byMemory=new Map();
  const memMap=new Map((db.memories||[]).map(m=>[m.id,m]));
  const placeMap=new Map((db.places||[]).map(p=>[p.id,p]));
  (db.memoryPlaceLinks||[]).forEach(l=>{
    const m=memMap.get(l.memoryId), p=placeMap.get(l.placeId);
    if(!m || !p) return;
    if(!byPlace.has(l.placeId)) byPlace.set(l.placeId, []);
    byPlace.get(l.placeId).push(m);
    if(!byMemory.has(l.memoryId)) byMemory.set(l.memoryId, []);
    byMemory.get(l.memoryId).push(p);
  });
  _placeMemIdx={byPlace, byMemory};
  return _placeMemIdx;
}
function memoriesOfPlace(placeId){ return placeMemIndex().byPlace.get(placeId) || []; }
function placesOfMemory(memoryId){ return placeMemIndex().byMemory.get(memoryId) || []; }
function memoryPlacesBox(memoryId){
  const places = placesOfMemory(memoryId);
  if(!places.length) return "";
  return `<div class="card" style="padding:14px 16px;margin-top:12px">
    <label class="sub" style="font-size:12px">📍 关联足迹</label>
    <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px">
      ${places.map(p=>{ const c=placeCatOf(p.categoryId); return `<span class="place-pill" onclick="go('place','${p.id}')">${c?c.icon:"📍"} ${esc(p.name)}</span>`; }).join("")}
    </div>
  </div>`;
}
function placeLocText(p){
  if(!p || p.locationPrecision==="无坐标" || p.locationPrecision==null) return "未定位（无坐标）";
  const lat=p.latitude!=null?p.latitude.toFixed(3):"—";
  const lng=p.longitude!=null?p.longitude.toFixed(3):"—";
  return `${lat}, ${lng}（${p.coordinateSystem||"WGS84"} · ${p.locationPrecision}）`;
}
function placeTimeOf(p){
  // 地点时间：优先首次到访日期，否则取关联回忆最早的事件日期（带缓存，筛选时避免重复计算）
  if(_placeTimeCache && _placeTimeCache.has(p.id)) return _placeTimeCache.get(p.id);
  let date = p.firstVisitedAt;
  if(!date){
    const ds = memoriesOfPlace(p.id).map(m=>m.eventDate).filter(Boolean).sort();
    date = ds[0] || "";
  }
  const year = date ? String(date).slice(0,4) : "";
  const age = calcAge(date);
  const r = {date, year, age};
  if(!_placeTimeCache) _placeTimeCache = new Map();
  _placeTimeCache.set(p.id, r);
  return r;
}
function placePrecBadge(p){
  const lp = p.locationPrecision || "无坐标";
  if(lp==="精确") return `<span class="pp-badge pp-exact">🎯 精确</span>`;
  if(lp==="城市级") return `<span class="pp-badge pp-city">🏙 城市级</span>`;
  return `<span class="pp-badge pp-none">🗺 无坐标</span>`;
}
function placeYearOptions(){
  const s=new Set(); (db.places||[]).forEach(p=>{ const y=placeTimeOf(p).year; if(y) s.add(y); });
  return [...s].sort();
}
function placeAgeOptions(){
  const s=new Set(); (db.places||[]).forEach(p=>{ const a=placeTimeOf(p).age; if(a!=null) s.add(a); });
  return [...s].sort((a,b)=>a-b);
}
function placePassYear(p){
  if(_placeYearFilter==="__all__") return true;
  const y=placeTimeOf(p).year;
  if(_placeYearFilter==="__none__") return !y;
  return y===_placeYearFilter;
}
function placePassAge(p){
  if(_placeAgeFilter==="__all__") return true;
  const a=placeTimeOf(p).age;
  if(_placeAgeFilter==="__none__") return a==null;
  return a!=null && a===parseInt(_placeAgeFilter,10);
}
function placeFilterChips(){

/* ---- 地图引擎：标记 / 聚合 / 定位 / 检索 ---- */
let _leafletMap = null, _leafletMarkers = [], _mapTiles = null, _mapGeoTemp = null, _mapGeoCandidates = [], _mapGeoTempData = null, _firstMapFit = true;
const _CLUSTER_MIN = 8; /* 定位地点超过此数才启用聚合 */
function leafletOk(){ return typeof L !== "undefined"; }
function mapFilteredPlaces(){
  const q = (($("#place-search")||{}).value||"").trim().toLowerCase();
  return (db.places||[]).filter(p=>{
    if(_placeCatFilter!=="__all__" && p.categoryId!==_placeCatFilter) return false;
    if(!placePassYear(p)) return false;
    if(!placePassAge(p)) return false;
    if(p.latitude==null||p.longitude==null||isNaN(p.latitude)||isNaN(p.longitude)) return false;
    if(q){ const hay=(p.name+" "+(p.city||"")+" "+(p.region||"")+" "+(p.country||"")+" "+(p.description||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function pinIcon(color, label){
  return L.divIcon({ className:"", html:`<div class="pm-pin"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 1.5C7.1 1.5 3 5.6 3 10.7c0 6.7 9 11.8 9 11.8s9-5.1 9-11.8C21 5.6 16.9 1.5 12 1.5z" fill="${color}" stroke="#FFFDF8" stroke-width="1.6"/><circle cx="12" cy="10.6" r="3.4" fill="#FFFDF8"/></svg>${label?`<span class="pm-label">${label}</span>`:""}</div>`, iconSize:[34,34], iconAnchor:[17,34], popupAnchor:[0,-30] });
}
function placeMarker(p, lat, lng){
  const cat=placeCatOf(p.categoryId);
  const color=cat?cat.color:"#C8A780";
  const cnt=memoriesOfPlace(p.id).length;
  const icon=pinIcon(color, esc(p.name));
  const m=L.marker([lat,lng], {icon});
  m.bindPopup(`<div style="min-width:150px"><b>${esc(p.name)}</b><div style="color:var(--sub);font-size:12px;margin:2px 0 6px">${esc([p.city,p.region].filter(Boolean).join(" · ")||"未填写位置")}</div><div style="font-size:12px">📖 ${cnt} 篇回忆</div><button class="btn small" style="margin-top:8px" onclick="go('place','${p.id}')">查看详情</button></div>`);
  return m;
}
function clusterMarker(count, lat, lng){
  const icon=L.divIcon({ className:"", html:`<div class="pm-cluster">${count}</div>`, iconSize:[38,38], iconAnchor:[19,19] });
  const m=L.marker([lat,lng], {icon});
  m.on("click", ()=>{ if(_leafletMap) _leafletMap.flyTo([lat,lng], Math.min(_leafletMap.getZoom()+2, 16)); });
  return m;
}
function _clusterCell(zoom){ return (60/256) * (360/Math.pow(2, zoom)); }
function renderPlaceMarkers(){
  if(!_leafletMap) return;
  _leafletMarkers.forEach(m=>_leafletMap.removeLayer(m));
  _leafletMarkers=[];
  const places = mapFilteredPlaces();
  const total = (db.places||[]).filter(p=>p.latitude!=null&&p.longitude!=null&&!isNaN(p.latitude)&&!isNaN(p.longitude)).length;
  const cc=$("#map-coord-count"); if(cc) cc.textContent = "已定位 "+places.length+" / "+total+" 个地点";
  if(!places.length){ if(_firstMapFit && total===0){ _leafletMap.setView([34.5,104.5],4); } _firstMapFit=false; return; }
  const zoom=_leafletMap.getZoom();
  const useCluster = places.length>=_CLUSTER_MIN;
  const cell=_clusterCell(zoom);
  if(useCluster){
    const buckets=new Map();
    places.forEach(p=>{
      const w=toWgs84(p.latitude,p.longitude,p.coordinateSystem);
      const k=Math.floor(w.lat/cell)+":"+Math.floor(w.lng/cell);
      if(!buckets.has(k)) buckets.set(k,[]);
      buckets.get(k).push({p,w});
    });
    buckets.forEach(items=>{
      if(items.length===1){ const it=items[0]; _leafletMarkers.push(placeMarker(it.p, it.w.lat, it.w.lng)); }
      else{
        const lat=items.reduce((s,x)=>s+x.w.lat,0)/items.length;
        const lng=items.reduce((s,x)=>s+x.w.lng,0)/items.length;
        _leafletMarkers.push(clusterMarker(items.length, lat, lng));
      }
    });
  }else{
    places.forEach(p=>{ const w=toWgs84(p.latitude,p.longitude,p.coordinateSystem); _leafletMarkers.push(placeMarker(p, w.lat, w.lng)); });
  }
  if(_firstMapFit){ fitPlacesBounds(places); _firstMapFit=false; }
}
function fitPlacesBounds(places){
  if(!_leafletMap || !places || !places.length) return;
  const ws=places.slice(0,2000).map(p=>toWgs84(p.latitude,p.longitude,p.coordinateSystem));
  const lats=ws.map(w=>w.lat), lngs=ws.map(w=>w.lng);
  const b=[[Math.min.apply(null,lats),Math.min.apply(null,lngs)],[Math.max.apply(null,lats),Math.max.apply(null,lngs)]];
  _leafletMap.fitBounds(b, {padding:[46,46], maxZoom:13});
}
function initPlacesMap(){
  if(!leafletOk()) return false;
  const el=document.getElementById("places-map");
  if(!el) return false;
  if(_leafletMap){ try{ _leafletMap.remove(); }catch(e){} _leafletMap=null; }
  _leafletMarkers=[]; _mapTiles=null; _firstMapFit=true;
  _leafletMap = L.map(el, {zoomControl:true, attributionControl:true}).setView([34.5,104.5],4);
  _mapTiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  });
  _mapTiles.on("tileerror", ()=>{ const b=$("#places-map"); if(b && !b.querySelector(".map-banner")){ const d=document.createElement("div"); d.className="map-banner"; d.textContent="⚠️ 地图瓦片加载失败（可能离线）——地点列表仍可正常使用"; b.appendChild(d); } });
  _mapTiles.addTo(_leafletMap);
  _leafletMap.on("zoomend", renderPlaceMarkers);
  renderPlaceMarkers();
  setTimeout(()=>{ if(_leafletMap) _leafletMap.invalidateSize(); }, 300);
  return true;
}
async function mapLocateMe(){
  if(!_leafletMap) initPlacesMap();
  if(!_leafletMap) return toast("地图不可用");
  toast("正在定位…");
  const r=await requestCurrentLocation();
  if(r.ok){
    _leafletMap.setView([r.lat, r.lng], 13);
    if(_mapGeoTemp) _leafletMap.removeLayer(_mapGeoTemp);
    _mapGeoTemp=L.marker([r.lat,r.lng], {icon:pinIcon("#5B7F6E", "")}).addTo(_leafletMap)
      .bindPopup(`<div style="min-width:140px"><b>当前位置</b><div style="color:var(--sub);font-size:12px;margin-top:2px">${esc(r.lat.toFixed(4))}, ${esc(r.lng.toFixed(4))}</div></div>`).openPopup();
    toast("已定位到当前位置");
  }else{
    toast(r.reason||"定位失败");
    const s=$("#place-geo-search"); if(s) s.focus();
  }
}
async function mapGeocode(){
  const inp=$("#place-geo-search"); const q=(inp?inp.value:"").trim();
  if(!q) return toast("请输入要检索的城市、地名或地址");
  const box=$("#place-geo-results");
  if(box) box.innerHTML=`<div class="geo-item"><span class="gi-ico">⏳</span><div class="gi-name">正在联网检索…</div></div>`;
  try{
    _mapGeoCandidates = await geocodeSearch(q);
    if(box) box.innerHTML = _mapGeoCandidates.length ? _mapGeoCandidates.map((r,i)=>`<div class="geo-item" onclick="mapPickGeo(${i})"><span class="gi-ico">📍</span><div class="gi-name"><b>${esc(r.name)}</b><div class="gi-sub">${esc(r.lat.toFixed(4))}, ${esc(r.lng.toFixed(4))} · WGS84</div></div></div>`).join("") : `<div class="geo-item"><span class="gi-ico">🔍</span><div class="gi-name">未找到匹配地点，可换个关键词</div></div>`;
  }catch(err){
    if(box) box.innerHTML=`<div class="geo-item"><span class="gi-ico">⚠️</span><div class="gi-name">${esc(err.message||"检索失败")}（可换关键词重试，或直接手动填写坐标）</div></div>`;
  }
}
function mapPickGeo(i){
  const r=(_mapGeoCandidates||[])[i];
  if(!r) return;
  if(!_leafletMap) initPlacesMap();
  if(!_leafletMap) return;
  _leafletMap.flyTo([r.lat, r.lng], 13);
  if(_mapGeoTemp) _leafletMap.removeLayer(_mapGeoTemp);
  _mapGeoTempData=r;
  _mapGeoTemp=L.marker([r.lat,r.lng], {icon:pinIcon("#5B7F6E","")}).addTo(_leafletMap)
    .bindPopup(`<div style="min-width:170px"><b>${esc(r.name)}</b><div style="color:var(--sub);font-size:12px;margin:4px 0 8px">${esc(r.lat.toFixed(4))}, ${esc(r.lng.toFixed(4))}</div><button class="btn small" onclick="addPlaceFromGeo()">＋ 在此新建地点</button></div>`).openPopup();
  const box=$("#place-geo-results"); if(box) box.innerHTML="";
}
function addPlaceFromGeo(){
  const r=_mapGeoTempData; if(!r) return;
  sessionStorage.setItem("pps_placeGeo", JSON.stringify({name:r.name.split("，")[0]||r.name, city:r.name.split("，")[0]||"", lat:r.lat, lng:r.lng, coordinateSystem:"WGS84"}));
  go("place-edit");
}
function mapFitAll(){
  if(!_leafletMap) return;
  const all=(db.places||[]).filter(p=>p.latitude!=null&&p.longitude!=null&&!isNaN(p.latitude)&&!isNaN(p.longitude));
  if(all.length) fitPlacesBounds(all); else _leafletMap.setView([34.5,104.5],4);
}
function filterPlacesData(){
  const q = (($("#place-search")||{}).value||"").trim().toLowerCase();
  return (db.places||[]).filter(p=>{
    if(_placeCatFilter!=="__all__" && p.categoryId!==_placeCatFilter) return false;
    if(!placePassYear(p)) return false;
    if(!placePassAge(p)) return false;
    if(q){
      const hay=(p.name+" "+(p.city||"")+" "+(p.region||"")+" "+(p.country||"")+" "+(p.description||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function placeCards(list){
  if(!list.length) return `<div class="card"><p class="sub" style="text-align:center;padding:20px">还没有足迹，添加第一个「地方」吧。</p></div>`;
  return list.map(p=>{
    const cat=placeCatOf(p.categoryId);
    const cnt=memoriesOfPlace(p.id).length;

/* ---- 地点编辑器：地图选点 / 检索 / 定位 ---- */
let _editorMap = null, _editorMarker = null, _editorGeoCandidates = [];
function initEditorMap(){
  if(!leafletOk()) return;
  const el=document.getElementById("p-map");
  if(!el) return;
  if(_editorMap){ try{ _editorMap.remove(); }catch(e){} _editorMap=null; }
  _editorMarker=null;
  _editorMap=L.map(el, {zoomControl:true}).setView([34.5,104.5],4);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(_editorMap);
  _editorMap.on("click", e=>setEditorCoord(e.latlng.lat, e.latlng.lng));
  const lat=parseFloat(($("#p-lat")||{}).value), lng=parseFloat(($("#p-lng")||{}).value);
  if(!isNaN(lat)&&!isNaN(lng)){
    const cs=(($("#p-cs")||{}).value)||"WGS84";
    const w=toWgs84(lat,lng,cs);
    _editorMap.setView([w.lat,w.lng], 13);
    _editorMarker=L.marker([w.lat,w.lng], {icon:pinIcon("#836548","")}).addTo(_editorMap);
  }
  setTimeout(()=>{ if(_editorMap) _editorMap.invalidateSize(); }, 300);
}
function setEditorCoord(lat,lng){
  const latI=$("#p-lat"), lngI=$("#p-lng"), csI=$("#p-cs"), lpI=$("#p-lp");
  if(latI) latI.value=lat.toFixed(6);
  if(lngI) lngI.value=lng.toFixed(6);
  if(csI) csI.value="WGS84";
  if(lpI && lpI.value==="无坐标") lpI.value="精确";
  if(_editorMap){
    if(_editorMarker) _editorMap.removeLayer(_editorMarker);
    _editorMarker=L.marker([lat,lng], {icon:pinIcon("#836548","")}).addTo(_editorMap);
  }
}
async function searchPlaceForEditor(){
  const inp=$("#p-geo-search"); const q=(inp?inp.value:"").trim();
  if(!q) return toast("请输入地名或地址");
  const box=$("#p-geo-results");
  if(box) box.innerHTML=`<div class="geo-item"><span class="gi-ico">⏳</span><div class="gi-name">正在检索…</div></div>`;
  try{
    _editorGeoCandidates = await geocodeSearch(q);
    if(box) box.innerHTML = _editorGeoCandidates.length ? _editorGeoCandidates.map((r,i)=>`<div class="geo-item" onclick="pickEditorGeo(${i})"><span class="gi-ico">📍</span><div class="gi-name"><b>${esc(r.name)}</b><div class="gi-sub">${esc(r.lat.toFixed(4))}, ${esc(r.lng.toFixed(4))}</div></div></div>`).join("") : `<div class="geo-item"><span class="gi-ico">🔍</span><div class="gi-name">未找到匹配地点</div></div>`;
  }catch(err){
    if(box) box.innerHTML=`<div class="geo-item"><span class="gi-ico">⚠️</span><div class="gi-name">${esc(err.message||"检索失败")}</div></div>`;
  }
}
function pickEditorGeo(i){
  const r=(_editorGeoCandidates||[])[i];
  if(!r) return;
  const city=$("#p-city"); if(city && !city.value) city.value=r.name.split("，")[0]||"";
  if(_editorMap) _editorMap.flyTo([r.lat,r.lng], 14);
  setEditorCoord(r.lat, r.lng);
  const box=$("#p-geo-results"); if(box) box.innerHTML="";
  toast("已选用："+r.name);
}
async function locateForEditor(){
  if(!_editorMap) initEditorMap();
  toast("正在定位…");
  const r=await requestCurrentLocation();
  if(r.ok){
    if(_editorMap) _editorMap.setView([r.lat,r.lng], 13);
    setEditorCoord(r.lat, r.lng);
    toast("已定位到当前位置");
  }else{
    toast(r.reason||"定位失败");
    const s=$("#p-geo-search"); if(s) s.focus();
  }
}
function savePlace(param){
  const name=$("#p-name").value.trim();
  if(!name) return toast("请填写地点名称");
  const lat=$("#p-lat").value, lng=$("#p-lng").value;
  const hasCoord = lat!=="" && lng!=="" && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng));
  let locPrec = $("#p-lp").value;
  if(!hasCoord) locPrec = "无坐标";
  else if(locPrec==="无坐标") locPrec = "城市级";
  const data={
    name,
    description:$("#p-desc").value.trim(),
    categoryId:$("#p-cat").value,
    city:$("#p-city").value.trim(), region:$("#p-region").value.trim(), country:$("#p-country").value.trim(),
    latitude: hasCoord?parseFloat(lat):null,
    longitude: hasCoord?parseFloat(lng):null,
    coordinateSystem: hasCoord?$("#p-cs").value:null,
    locationPrecision: locPrec,
    firstVisitedAt:$("#p-first").value, lastVisitedAt:$("#p-last").value,
    coverImage: _EDIT_COVER,
  };
  if(param){
    const p=(db.places||[]).find(x=>x.id===param);
    if(!p) return toast("地点不存在");
    Object.assign(p, data, {updatedAt:Date.now()});
    save(); toast("已保存修改"); go("place", param);
  }else{
    const p={id:uid(), ...data, coverMediaId:null, createdAt:Date.now(), updatedAt:Date.now()};
    db.places.push(p);
    sessionStorage.removeItem("pps_placeGeo");
    save(); toast("已添加地点 🗺️"); go("place", p.id);
  }
}
function deletePlace(id){
  const p=(db.places||[]).find(x=>x.id===id);
  if(!p) return;
  const cnt=placeLinksOfPlace(id).length;
  const msg=`确定删除地点「${p.name}」吗？`+(cnt?`\n该地点关联了 ${cnt} 篇回忆，删除后仅解除关联，不会删除任何回忆。`:"\n删除后不可恢复。");
  if(!confirm(msg)) return;
  db.places=(db.places||[]).filter(x=>x.id!==id);
  db.memoryPlaceLinks=(db.memoryPlaceLinks||[]).filter(l=>l.placeId!==id);
  db.goalPlaceLinks=(db.goalPlaceLinks||[]).filter(l=>l.placeId!==id);
  save(); toast("已删除地点（回忆保留）"); go("places");
}

let _personCatFilter = "__all__";
let _personSort = "updated", _personFavOnly = false;
let _curPersonId = null, _personLinkSelectorOpen = false;
let _EDIT_AVATAR = null, _curEditingPerson = null;
let _EDIT_PHOTOS = [], _EDIT_PHOTO_CANDIDATES = [];
function personCatOf(id){ return (db.personCategories||[]).find(c=>c.id===id); }
function personLinksOfPerson(personId){ return (db.memoryPersonLinks||[]).filter(l=>l.personId===personId); }
function personLinksOfMemory(memoryId){ return (db.memoryPersonLinks||[]).filter(l=>l.memoryId===memoryId); }
function memoriesOfPerson(personId){ return personLinksOfPerson(personId).map(l=>db.memories.find(m=>m.id===l.memoryId)).filter(Boolean); }
function personsOfMemory(memoryId){ return personLinksOfMemory(memoryId).map(l=>(db.persons||[]).find(p=>p.id===l.personId)).filter(Boolean); }
function personInitialOf(p){ const n=(p.displayName||"").trim(); return n?n[0]:"人"; }
function avatarHtml(p, size){
  if(p.avatarImage) return `<span class="person-avatar" style="width:${size}px;height:${size}px"><img src="${p.avatarImage}"></span>`;
  const c=personCatOf(p.relationCategoryId);
  return `<span class="person-avatar ph" style="width:${size}px;height:${size}px;background:${c?c.color:"#C8A780"};font-size:${Math.round(size*0.42)}px">${esc(personInitialOf(p))}</span>`;
}
function relTime(ts){
  if(!ts) return "";
  const d=Date.now()-ts;
  if(d<60*1000) return "刚刚";
  if(d<3600*1000) return Math.floor(d/60000)+" 分钟前";
  if(d<86400*1000) return Math.floor(d/3600000)+" 小时前";
  if(d<30*86400*1000) return Math.floor(d/86400000)+" 天前";
  const t=new Date(ts); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
function metText(p){
  if(!p.metAt) return "相识时间待整理";
  if(p.metDatePrecision==="年份") return esc(p.metAt)+" 年";
  return esc(p.metAt);
}
function memDateText(m){
  const d=(m.eventDate||"").trim();
  if(!d) return "时间待整理";
  if(/^\d{4}$/.test(d)) return d+" 年（约）";
  return d;
}

  <div id="person-list">${personCards(filterPeopleData())}</div>`;
