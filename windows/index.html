function filterPeopleData(){
  const q=(($("#person-search")||{}).value||"").trim().toLowerCase();
  const list=(db.persons||[]).filter(p=>{
    if(_personCatFilter!=="__all__" && p.relationCategoryId!==_personCatFilter) return false;
    if(_personFavOnly && !p.isFavorite) return false;
    if(q){
      const hay=(p.displayName+" "+(p.alias||"")+" "+(p.description||"")+" "+(p.notes||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(_personSort==="met") list.sort((a,b)=>(a.metAt||"9999").localeCompare(b.metAt||"9999"));
  else if(_personSort==="custom") list.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
  else list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  return list;
}
function personCards(list){
  if(!list.length) return `<div class="card"><div style="text-align:center;padding:24px 0">

  return list.map(p=>{

    const cnt=memoriesOfPerson(p.id).length;
    return `<div class="person-card" onclick="go('person','${p.id}')">
      ${avatarHtml(p,48)}

        <div class="pc-desc">${cat?cat.icon+" "+esc(cat.name):"未分类"}${p.description?` · ${esc(p.description)}`:""}</div>
        <div class="pc-meta">📖 ${cnt} 篇回忆${p.updatedAt?` · 更新于 ${relTime(p.updatedAt)}`:""}</div>
      </div>
      <span class="arr sub">›</span>
    </div>`;
  }).join("");
}
function filterPeople(){ const l=$("#person-list"); if(l) l.innerHTML=personCards(filterPeopleData()); }
document.addEventListener("click", e=>{
  const c=e.target.closest("[data-prcat]");
  if(c && c.closest("#person-cat-filter")){
    _personCatFilter=c.dataset.prcat;
    document.querySelectorAll("#person-cat-filter .chip").forEach(x=>x.classList.remove("active"));
    c.classList.add("active");
    filterPeople();
    return;
  }
  const s=e.target.closest("[data-psort]");
  if(s && s.closest("#person-sort")){
    _personSort=s.dataset.psort;
    document.querySelectorAll("#person-sort [data-psort]").forEach(x=>x.classList.remove("active"));
    s.classList.add("active");
    filterPeople();
    return;
  }
  const f=e.target.closest("[data-pfav]");
  if(f && f.closest("#person-sort")){
    _personFavOnly=!_personFavOnly;
    f.classList.toggle("active", _personFavOnly);
    filterPeople();
  }
});

function savePerson(param){
  const name=$("#p-name").value.trim();
  if(!name) return toast("请填写昵称或名称");
  let metAt=$("#p-met").value.trim();
  let prec=$("#p-met-prec").value;
  if(!metAt) prec="";
  else if(prec==="年份") metAt=metAt.replace(/\D/g,"").slice(0,4);
  const data={
    displayName:name,
    alias:$("#p-alias").value.trim(),
    relationCategoryId:$("#p-rel").value,
    metAt, metDatePrecision:prec,
    description:$("#p-desc").value.trim(),
    notes:$("#p-notes").value.trim(),
    isFavorite:$("#p-fav").checked,
    metPlaceId:$("#p-met-place").value||null,
    avatarImage:_EDIT_AVATAR,
    photos:_EDIT_PHOTOS,
  };
  if(param){
    const p=(db.persons||[]).find(x=>x.id===param);
    if(!p) return toast("人物不存在");
    Object.assign(p, data, {updatedAt:Date.now()});
    save(); toast("已保存修改"); go("person", param);
  }else{
    const p={id:uid(), ...data, avatarMediaId:null, sortOrder:(db.persons||[]).length+1, createdAt:Date.now(), updatedAt:Date.now()};
    db.persons.push(p);
    save(); toast("已添加人物 👤"); go("person", p.id);
  }
}
function deletePerson(id){
  const p=(db.persons||[]).find(x=>x.id===id);
  if(!p) return;
  const cnt=personLinksOfPerson(id).length;
  const msg=`确定删除人物「${p.displayName}」吗？`+(cnt?`\n该人物关联了 ${cnt} 篇回忆，删除后仅解除关联，不会删除任何回忆。`:"\n删除后不可恢复。");
  if(!confirm(msg)) return;
  db.persons=(db.persons||[]).filter(x=>x.id!==id);
  db.memoryPersonLinks=(db.memoryPersonLinks||[]).filter(l=>l.personId!==id);
  save(); toast("已删除人物（回忆保留）"); go("people");
}

async function genFragStory(){
  if(!aiKey()){ toast("请先配置 API Key"); setTimeout(()=>go("ai"),800); return; }
  const c=fragMergeConflicts();
  const src=c.fs.map((f,i)=>`【片段 ${i+1}】${f.textOriginal||""}`).join("\n\n");
  if(!src.trim()) return toast("所选碎片没有文字内容，无法交给 AI 整理");
  if(!confirm(`即将把勾选的 ${c.fs.length} 片碎片文字发送至模型服务商进行整理，可能产生费用。是否继续？`)) return;
  const btn=$("#frag-ai-gen"); if(btn){btn.disabled=true; btn.textContent="生成中…";}
  try{
    const out=await aiRequest([
      {role:"system", content:fragStorySystemPrompt()},
      {role:"user", content:src},
    ]);
    _fragAiResult=out;
    const box=$("#frag-ai-result"); if(box) box.value=out;
    const adopt=$("#frag-ai-adopt"); if(adopt) adopt.disabled=false;
    toast("已生成故事草稿，可继续编辑");
  }catch(err){ toast("生成失败："+err.message); }
  finally{ if(btn){btn.disabled=false; btn.textContent="🤖 生成故事";} }
}

function saveFragment(){

  f.manualAge=$("#frag-age").value?parseInt($("#frag-age").value):null;

/* ============ 人生足迹 · 阶段二：坐标系转换 / 地图服务 / 三端定位 ============ */
const GEO_PI = Math.PI, GEO_A = 6378245.0, GEO_EE = 0.00669342162296594323, GEO_XPI = GEO_PI * 3000.0 / 180.0;
function geoOutOfChina(lat,lng){ return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271; }
function geoTlat(x,y){
  let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*GEO_PI)+20*Math.sin(2*x*GEO_PI))*2/3;
  r+=(20*Math.sin(y*GEO_PI)+40*Math.sin(y/3*GEO_PI))*2/3;
  r+=(160*Math.sin(y/12*GEO_PI)+320*Math.sin(y*GEO_PI/30))*2/3;
  return r;
}
function geoTlng(x,y){
  let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*GEO_PI)+20*Math.sin(2*x*GEO_PI))*2/3;
  r+=(20*Math.sin(x*GEO_PI)+40*Math.sin(x/3*GEO_PI))*2/3;
  r+=(150*Math.sin(x/12*GEO_PI)+300*Math.sin(x/30*GEO_PI))*2/3;
  return r;
}
function wgs84ToGcj02(lat,lng){
  if(geoOutOfChina(lat,lng)) return {lat,lng};
  let dLat=geoTlat(lng-105,lat-35), dLng=geoTlng(lng-105,lat-35);
  const radLat=lat/180*GEO_PI; let magic=Math.sin(radLat);
  magic=1-GEO_EE*magic*magic; const sm=Math.sqrt(magic);
  dLat=(dLat*180)/((GEO_A*(1-GEO_EE))/(magic*sm)*GEO_PI);
  dLng=(dLng*180)/(GEO_A/sm*Math.cos(radLat)*GEO_PI);
  return {lat:lat+dLat, lng:lng+dLng};
}
function gcj02ToWgs84(lat,lng){
  if(geoOutOfChina(lat,lng)) return {lat,lng};
  const g=wgs84ToGcj02(lat,lng);
  return {lat:lat*2-g.lat, lng:lng*2-g.lng};
}
function bd09ToGcj02(lat,lng){
  const x=lng-0.0065, y=lat-0.006;
  const z=Math.sqrt(x*x+y*y)-0.00002*Math.sin(y*GEO_XPI);
  const th=Math.atan2(y,x)-0.000003*Math.cos(x*GEO_XPI);
  return {lat:z*Math.sin(th), lng:z*Math.cos(th)};
}
function gcj02ToBd09(lat,lng){
  const z=Math.sqrt(lng*lng+lat*lat)+0.00002*Math.sin(lat*GEO_XPI);
  const th=Math.atan2(lat,lng)+0.000003*Math.cos(lng*GEO_XPI);
  return {lat:z*Math.sin(th)+0.006, lng:z*Math.cos(th)+0.0065};
}
function bd09ToWgs84(lat,lng){ const g=bd09ToGcj02(lat,lng); return gcj02ToWgs84(g.lat,g.lng); }
function wgs84ToBd09(lat,lng){ const g=wgs84ToGcj02(lat,lng); return gcj02ToBd09(g.lat,g.lng); }
function toWgs84(lat,lng,cs){
  if(cs==="GCJ-02") return gcj02ToWgs84(lat,lng);
  if(cs==="BD09") return bd09ToWgs84(lat,lng);
  return {lat,lng}; /* WGS84 或未知：原样返回 */
}

/* 地图服务：默认 OpenStreetMap Nominatim（免费、无需密钥，返回 WGS84）。
   如需更高精度中文 POI 检索，可在此扩展高德/腾讯等带 Key 的 provider（注意密钥不得写入源码/导出包）。 */
const GEO_NOM = "https://nominatim.openstreetmap.org";
async function geocodeSearch(q, limit){
  limit = limit||8;
  const url = GEO_NOM+"/search?format=jsonv2&limit="+limit+"&accept-language=zh-CN&q="+encodeURIComponent(q);
  const res = await fetch(url, {headers:{"Accept":"application/json"}});
  if(!res.ok) throw new Error("检索失败（HTTP "+res.status+"）");
  const arr = await res.json();
  return (arr||[]).map(r=>({
    name: String(r.display_name||r.name||"").split(",").slice(0,3).join("，"),
    fullName: r.display_name||r.name||"",
    lat: parseFloat(r.lat), lng: parseFloat(r.lon),
    coordinateSystem: "WGS84", providerId: "nominatim:"+(r.place_id||""),
  })).filter(r=>!isNaN(r.lat)&&!isNaN(r.lng));
}
async function reverseGeocode(lat,lng){
  const url = GEO_NOM+"/reverse?format=jsonv2&accept-language=zh-CN&lat="+lat+"&lon="+lng;
  const res = await fetch(url, {headers:{"Accept":"application/json"}});
  if(!res.ok) throw new Error("逆地理编码失败（HTTP "+res.status+"）");
  const r = await res.json();
  if(!r || r.error || r.lat==null) return null;
  return { name: String(r.display_name||r.name||""), lat:parseFloat(r.lat), lng:parseFloat(r.lon), coordinateSystem:"WGS84", providerId:"nominatim:"+(r.place_id||"") };
}

/* 三端定位适配器：按需触发，绝不后台持续追踪 */
function requestCurrentLocation(){
  return new Promise((resolve)=>{
    if(!("geolocation" in navigator)){ resolve({ok:false, reason:"当前环境不支持定位"}); return; }
    let done=false;
    const t=setTimeout(()=>finish({ok:false, reason:"定位超时，可改用城市检索"}), 12000);
    const finish=v=>{ if(!done){ done=true; clearTimeout(t); resolve(v); } };
    navigator.geolocation.getCurrentPosition(
      p=>finish({ok:true, lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy}),
      e=>finish({ok:false, reason:geoErrorText(e)}),
      {enableHighAccuracy:false, timeout:12000, maximumAge:120000}
    );
  });
}
function geoErrorText(e){
  if(!e) return "定位失败";
  if(e.code===1) return "定位权限被拒绝，可改用城市检索";
  if(e.code===2) return "无法获取位置，可改用城市检索";
  if(e.code===3) return "定位超时，可改用城市检索";
  return "定位失败（"+e.message+"）";
}

function letterState(l){
  if(l.status==="draft") return {k:"草稿", open:false};
  if(l.openedAt) return {k:"已开启", open:true};
  if(new Date()>=new Date(l.unlockAt+"T00:00:00")) return {k:"可开启", open:true};
  return {k:"已封存", open:false};
}

  ${db.letters.length?db.letters.map(l=>{
    const st=letterState(l);
    const ico = l.status==="draft"?"📝":(st.open?"📮":(l.cover===1?"🌿":l.cover===2?"🍃":"⏳"));
    return `<div class="letter l${l.cover} ${st.open?"":"locked"}" onclick="go('letter','${l.id}')">

function readLetterForm(){
  return {title:$("#lt-title").value.trim(), salutation:$("#lt-sal").value.trim(), body:$("#lt-body").value, unlockAt:$("#lt-unlock").value, cover:_letterCover};
}
function saveLetterDraft(id){
  const f=readLetterForm();
  if(!f.title && !f.body) return toast("先写点内容吧");
  if(id){ const l=db.letters.find(x=>x.id===id); Object.assign(l, f); }
  else { db.letters.push({id:uid(), ...f, status:"draft", createdAt:new Date().toISOString().slice(0,10)}); }
  save(); toast("草稿已保存"); go("letters");
}
function sealLetter(id){
  const f=readLetterForm();
  if(!f.title || !f.body) return toast("请填写标题和正文");
  if(!f.unlockAt) return toast("请选择开启日期");
  if(new Date(f.unlockAt+"T00:00:00") <= new Date()) return toast("开启日期需晚于今天");
  if(id){ const l=db.letters.find(x=>x.id===id); Object.assign(l, f, {status:"sealed", sealedAt:new Date().toISOString()}); }
  else { db.letters.push({id:uid(), ...f, status:"sealed", sealedAt:new Date().toISOString(), createdAt:new Date().toISOString().slice(0,10)}); }
  save();
  sealAnimation(()=>go("letters"));
}
function sealAnimation(cb){
  const host=document.createElement("div"); host.id="seal-host";
  host.innerHTML=`<div class="seal-box"><div class="env"><div class="flap"></div></div><div class="paper"></div><div class="dot">封</div><div class="seal-tip">信已封存 🌿</div></div>`;
  document.body.appendChild(host);
  setTimeout(()=>{ host.remove(); cb&&cb(); }, 1800);
}

function downloadBlob(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function cnNum(n){
  const d=["零","一","二","三","四","五","六","七","八","九"];
  if(n<10) return d[n];
  if(n===10) return "十";
  if(n<20) return "十"+d[n%10];
  if(n<100) return d[Math.floor(n/10)]+"十"+(n%10?d[n%10]:"");
  return String(n);
}
function cnYearStr(y){
  const d="〇一二三四五六七八九";
  return String(y).split("").map(c=>d[+c]||c).join("");
}

function exportTXT(){
  const L=[];
  L.push(db.book.title); if(db.book.subtitle) L.push(db.book.subtitle);
  L.push("作者："+db.book.author); L.push("");
  L.push("【序言】"); L.push(db.book.preface||""); L.push("");
  const ages=ageRangeOf(db.memories);
  L.push("【目录】");
  ages.forEach((a,i)=>L.push("第"+cnNum(i+1)+"章 · "+a+"岁"));
  L.push("");
  ages.forEach((a,i)=>{
    L.push("第"+cnNum(i+1)+"章 · "+a+"岁");
    L.push("==============================");
    db.memories.filter(m=>m.age===a).sort((x,y)=>(x.eventDate||"").localeCompare(y.eventDate||"")).forEach(m=>{
      L.push("《"+m.title+"》");
      L.push((m.eventDate||"时间待整理")+(m.place?" · "+m.place:""));
      L.push(m.content||"(图片/录音记录)");
      L.push("");
    });
    L.push("");
  });
  downloadBlob(new Blob(["\ufeff"+L.join("\n")],{type:"text/plain;charset=utf-8"}), "平生述-"+db.book.title.replace(/[\s:：]/g,"")+".txt");
  toast("已导出 TXT");
}

const _crcTable=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

    cd.setUint16(q,0,true); q+=2;
    cd.setUint16(q,0,true); q+=2;
    cd.setUint16(q,0x21,true); q+=2;
    cd.setUint32(q,crc,true); q+=4;

    cd.setUint16(q,0,true); q+=2;

function extOf(dataUrl){

  if(t==="image/png") return ".png";
  if(t==="image/webp") return ".webp";
  if(t==="image/gif") return ".gif";
  if(t.indexOf("audio/ogg")>=0) return ".ogg";
  if(t.indexOf("audio/mp4")>=0||t.indexOf("audio/aac")>=0) return ".m4a";

/* ---------- WebDAV 云备份（BYOD） ---------- */
function wdBase(){ return ((db.webdav||{}).url||"").trim().replace(/\/+$/,""); }
function wdHeaders(){
  const wd=db.webdav||{}; const h={};
  if(wd.user) h["Authorization"]="Basic "+btoa(unescape(encodeURIComponent(wd.user+":"+(wd.pass||""))));
  return h;
}
async function wdRequest(method, path, body, headers){
  const base=wdBase();
  if(!base) throw {message:"请先配置 WebDAV 地址"};
  const url=base+"/"+(path||"").replace(/^\/+/,"");
  const res=await fetch(url,{method, headers:Object.assign(wdHeaders(), headers||{}), body});
  if(!res.ok) throw {message:"WebDAV 错误 "+res.status+(res.status===401?"（用户名或密码错误）":res.status===404?"（路径不存在）":res.status===405?"（该服务器不支持此操作）":"")};
  return res;
}

  return `

async function webdavBackup(){
  if(!wdBase()) return toast("请先配置 WebDAV 地址");
  try{
    const clean=JSON.parse(JSON.stringify(db)); if(clean.ai) clean.ai.key=""; if(clean.webdav) clean.webdav.pass="";
    const body=JSON.stringify(clean,null,2);
    await wdRequest("MKCOL","平生述").catch(()=>{});
    await wdRequest("PUT","平生述/最新备份.json", body, {"Content-Type":"application/json"});
    await wdRequest("PUT","平生述/平生述备份-"+new Date().toISOString().slice(0,10)+".json", body, {"Content-Type":"application/json"});

async function webdavRestore(){
  try{
    const f=await wdRequest("GET","平生述/最新备份.json");
    const d=JSON.parse(await f.text());
    if(!d || !Array.isArray(d.memories)) return toast("云端备份格式不正确");
    if(!confirm("将用 WebDAV 上的备份覆盖当前本地数据，是否继续？")) return;
    db=d; if(!db.seq) db.seq=1000; save(); toast("已从 WebDAV 恢复"); render();
  }catch(e){ toast("恢复失败："+(e.message||e)); }
}

const GOAL_STATUS = ["未开始","进行中","已完成","已暂停","已放弃"];
const GOAL_PRIORITY = ["高","中","低"];
function statusClass(s){ return {"未开始":"st0","进行中":"st1","已完成":"st2","已暂停":"st3","已放弃":"st4"}[s]||"st0"; }
function catOf(id){ return (db.goalCategories||[]).find(c=>c.id===id); }
function goalsOfYear(y){ return (db.goals||[]).filter(g=>g.year===y).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)); }
function goalProgress(g){
  if(g.progressMode==="number"){
    const t=Number(g.targetValue)||0;
    if(t<=0) return 0;
    return Math.min(100, Math.max(0, Math.round((Number(g.currentValue)||0)/t*100)));
  }
  if(g.progressMode==="manual"){
    return Math.min(100, Math.max(0, Math.round(Number(g.manualProgress)||0)));
  }
  const tasks=(db.goalTasks||[]).filter(t=>t.goalId===g.id);
  if(!tasks.length) return -1;
  const done=tasks.filter(t=>t.isCompleted).length;
  return Math.round(done/tasks.length*100);
}
function goalProgressText(g){
  const p=goalProgress(g);
  if(g.progressMode==="task" && p<0) return "尚未拆分任务";
  if(g.progressMode==="number") return (g.currentValue||0)+" / "+(g.targetValue||0)+" "+(g.unit||"");
  return p+"%";
}

function saveGoal(id){
  const title=$("#g-title").value.trim();
  if(!title) return toast("请填写目标名称");
  const year=parseInt($("#g-year").value,10) || _goalYear;
  const data={
    title,
    description:$("#g-desc").value.trim(),
    year,
    categoryId:$("#g-cat").value,
    startDate:$("#g-start").value,
    dueDate:$("#g-due").value,
    priority:$("#g-priority").value,
    status:$("#g-status").value,
    showOnTimeline: document.getElementById("g-timeline")? document.getElementById("g-timeline").checked : false,

    targetValue: _gmode==="number"? (Number(gval("g-target"))||0) : 0,

    unit: _gmode==="number"? gval("g-unit").trim() : "",

      Object.assign(g, data);
      if(prev!=="已完成" && data.status==="已完成" && !g.completedAt) g.completedAt=new Date().toISOString();
      if(data.status!=="已完成") g.completedAt=null;
      g.updatedAt=Date.now();

  }else{
    const g={id:uid(), ...data, sortOrder:(db.goals||[]).length, createdAt:Date.now(), updatedAt:Date.now()};

function moveTask(id,dir){
  const t=(db.goalTasks||[]).find(x=>x.id===id);
  if(!t) return;
  const sibs=(db.goalTasks||[]).filter(x=>x.goalId===t.goalId && !x.isCompleted).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
  const i=sibs.findIndex(x=>x.id===id);
  const j=i+dir;
  if(j<0||j>=sibs.length) return;
  const so=sibs[i].sortOrder; sibs[i].sortOrder=sibs[j].sortOrder; sibs[j].sortOrder=so;
  save(); render();
}

  const goals=goalsOfYear(y);
  if(!goals.length) return "";
  const done=goals.filter(g=>g.status==="已完成").length;
  const active=goals.filter(g=>["未开始","进行中"].includes(g.status)).length;
  const paused=goals.filter(g=>["已暂停","已放弃"].includes(g.status)).length;
  let s=`${y} 年，我为自己设定了 ${goals.length} 个目标，完成了其中的 ${done} 个。`;
  if(active) s+=`还有 ${active} 个愿望仍在路上。`;
  if(paused) s+=`有 ${paused} 个计划暂时停在了途中。`;
  s+=`那些已经实现的愿望，和仍在努力的事情，共同组成了这一年的成长。`;
  return s;
}

  return (db.goalMemoryLinks||[]).filter(l=>l.goalId===goalId).map(l=>(db.memories||[]).find(x=>x.id===l.memoryId)).filter(Boolean);
}
function startGoalMemory(goalId){
  const g=(db.goals||[]).find(x=>x.id===goalId);
  if(!g) return;
  const c=catOf(g.categoryId);
  sessionStorage.setItem("pps_goalLink", goalId);
  sessionStorage.setItem("pps_prefill", JSON.stringify({
    title: g.title,
    date: g.completedAt ? String(g.completedAt).slice(0,10) : "",
    tags: [c?c.name:"", "年度目标"].filter(Boolean),
    prompt: "这个愿望终于实现了，为它留下一段回忆吧。",
  }));
  go("record");
}
function addGoalToBook(goalId){
  const g=(db.goals||[]).find(x=>x.id===goalId);
  if(!g) return;
  if((db.goalMemoryLinks||[]).some(l=>l.goalId===goalId && l.relationType==="人生之书")){
    return toast("已加入过人生之书");
  }
  const date = g.completedAt ? String(g.completedAt).slice(0,10) : (g.year+"-12-31");
  const body = g.completionReflection || `【年度目标】${g.title}${g.description?(" —— "+g.description):""}。这一年，我为它付出了努力，也收获了成长。`;
  const m={id:uid(), title:"年度故事 · "+g.title, content:body, eventDate:date, age:calcAge(date), place:"", tags:["年度目标"], prompt:"", createdAt:Date.now()};
  db.memories.push(m);
  db.goalMemoryLinks=(db.goalMemoryLinks||[]);
  db.goalMemoryLinks.push({id:uid(), goalId, memoryId:m.id, relationType:"人生之书", createdAt:Date.now()});
  save(); toast("已加入人生之书"); render();
}
function goYearGoals(year){ _goalYear=year; go("goals"); }
function timelineEvents(){
  const mems=db.memories.map(m=>({type:"mem", id:m.id, date:m.eventDate||"", title:m.title, content:m.content, tags:m.tags||[]}));
  const goals=(db.goals||[]).filter(g=>g.showOnTimeline && g.completedAt).map(g=>({type:"goal", id:g.id, date:String(g.completedAt).slice(0,10), title:g.title, content:(g.completionReflection||g.description||""), tags:["年度目标", (catOf(g.categoryId)?catOf(g.categoryId).name:"")].filter(Boolean)}));
  return mems.concat(goals);
}
/* ============ 阶段五：AI 年度总结 ============ */
const REVIEW_STYLES = {
  "温柔回顾":"文字细腻、有温度，像回顾一段珍贵的一年。",
  "朴实真实":"像本人向读者介绍这一年的经历，真实自然，避免华丽辞藻。",
  "文学散文":"适当采用散文笔法，增强文字美感。",
  "成长总结":"侧重这一年的成长与收获，条理清晰。",
};
let _reviewStyle="温柔回顾", _reviewCustom="";
function reviewAIData(y){
  return goalsOfYear(y).map(g=>{
    const c=catOf(g.categoryId);
    const tasks=(db.goalTasks||[]).filter(t=>t.goalId===g.id);
    const doneT=tasks.filter(t=>t.isCompleted).length;
    return `·《${g.title}》（${c?c.name:"未分类"}）：状态 ${g.status}${g.completionReflection?("，完成感言："+g.completionReflection):""}${tasks.length?("，子任务完成 "+doneT+"/"+tasks.length):""}`;
  }).join("\n");
}
async function genReviewAI(y){
  if(!aiKey()){ toast("请先配置 API Key"); setTimeout(()=>go("ai"),800); return; }
  const goals=goalsOfYear(y);
  if(!goals.length) return toast("这一年还没有目标，无法生成 AI 总结");
  const data=reviewAIData(y);
  if(_reviewStyle==="自定义"){ _reviewCustom=($("#review-custom")||{value:""}).value||""; if(!_reviewCustom.trim()) return toast("请填写自定义要求"); }
  if(!confirm("将把这一年的目标、任务与完成感言发送至模型服务商生成年度总结，可能产生费用。是否继续？")) return;
  const btn=$("#review-ai-btn"); if(btn){btn.disabled=true; btn.textContent="生成中…";}
  const styleDesc=_reviewStyle==="自定义"?_reviewCustom:REVIEW_STYLES[_reviewStyle];
  try{
    const sys=`你是「平生述」年度回顾的写作者。严格遵循：仅依据用户提供的年度目标与完成情况撰写总结；不编造不存在的经历，不虚构事件与人物，不把不确定的事情写成事实。语言真诚、有温度，符合用户指定风格。只输出总结正文，不加标题。`;
    const out=await aiRequest([
      {role:"system", content:sys},
      {role:"user", content:`年度总结风格：${_reviewStyle}（${styleDesc}）\n\n以下为该年度的目标与完成情况：\n${data}`},
    ]);
    let r=(db.annualReviews||[]).find(x=>x.year===y);
    if(!r){ r={id:uid(), year:y, originalSummary:"", aiGeneratedSummary:"", finalSummary:"", sourceGoalIds:[], snapshotData:null, status:"draft", createdAt:Date.now(), updatedAt:Date.now()}; db.annualReviews.push(r); }
    r.aiGeneratedSummary=out; r.updatedAt=Date.now(); save();
    const box=$("#review-summary"); if(box) box.value=out;
    toast("AI 年度总结已生成，可编辑后保存");
  }catch(err){ toast("生成失败："+err.message); }
  finally{ if(btn){btn.disabled=false; btn.textContent="✨ AI 帮我写";} }
}
document.addEventListener("click", e=>{
  const s=e.target.closest("[data-rvstyle]");
  if(s && s.closest("#rv-styles")){
    _reviewStyle=s.dataset.rvstyle;
    document.querySelectorAll("#rv-styles .chip").forEach(c=>c.classList.toggle("active", c.dataset.rvstyle===s.dataset.rvstyle));
    const cc=document.getElementById("rv-custom-area");
    if(cc) cc.innerHTML = _reviewStyle==="自定义" ? `<div class="field"><input id="review-custom" placeholder="输入你的写作要求…" value="${esc(_reviewCustom)}"></div>` : "";
  }
});
document.addEventListener("click", e=>{
  const c=e.target.closest("[data-gmode]");
  if(c && c.closest("#g-mode")) setGoalMode(c.dataset.gmode);
  const f=e.target.closest("[data-gcat]");
  if(f && f.closest("#goal-cat-filter")){
    _goalCatFilter=f.dataset.gcat;
    document.querySelectorAll("#goal-cat-filter .chip").forEach(x=>x.classList.remove("active"));
    f.classList.add("active");
    render();
  }
});

/* ---------- 启动 ---------- */
async function boot(){
  try{
    const raw = await idbGet("data");
    if(typeof raw==="string" && raw){ db = JSON.parse(raw); }
    else{
      const ls = localStorage.getItem(LS_KEY);
      if(ls){ try{ db = JSON.parse(ls); }catch(e){ db = seed(); } localStorage.removeItem(LS_KEY); }
      else db = seed();
    }
  }catch(e){ db = seed(); }
  normalizeDb(db);
  render();
}
boot();
</script>
